<!DOCTYPE html>
<html>
<head>
    <title>RiddleNet - Data Sync Fix</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px;
            color: white;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        h2 {
            color: #ffd700;
            margin-top: 30px;
        }
        .status {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px 5px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        .success {
            color: #00ff00;
        }
        .error {
            color: #ff4444;
        }
        .warning {
            color: #ffaa00;
        }
        .info {
            color: #00aaff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 RiddleNet Data Sync Fix</h1>
        <p style="text-align: center; font-size: 1.2em;">Fix the data mismatch between Topology Progress and Foundation Progress</p>

        <h2>Current Status:</h2>
        <div class="status" id="status">
            Click "Check Status" to diagnose the issue...
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <button onclick="checkStatus()">🔍 Check Status</button>
            <button onclick="fixSync()">🔧 Fix Sync Issue</button>
            <button onclick="goBack()">↩️ Back to RiddleNet</button>
        </div>
    </div>

    <script>
        function checkStatus() {
            const status = document.getElementById('status');
            let output = '';

            // Get topology progress
            const topologyProgress = JSON.parse(localStorage.getItem('topologyProgress') || '{}');
            const topologyModules = topologyProgress.completedModules || [];
            
            // Get foundation progress
            const foundationProgress = JSON.parse(localStorage.getItem('foundation_progress') || '{}');
            const foundationModules = foundationProgress.completedModules || [];

            // Get challenge results
            const challengeResults = JSON.parse(localStorage.getItem('challenge_results') || '{}');
            const challengeFoundation = challengeResults.foundation || [];

            output += '<span class="info">📊 TOPOLOGY PROGRESS:</span>\n';
            output += `  Modules: ${topologyModules.length}\n`;
            output += `  Phase 1: ${topologyProgress.phase1Complete ? '✅' : '❌'}\n`;
            output += `  Phase 2: ${topologyProgress.phase2Complete ? '✅' : '❌'}\n`;
            output += `  Phase 3: ${topologyProgress.phase3Complete ? '✅' : '❌'}\n\n`;

            output += '<span class="warning">📦 FOUNDATION PROGRESS:</span>\n';
            output += `  Modules: ${foundationModules.length}\n`;
            output += `  Phase 1: ${foundationProgress.phase1Complete ? '✅' : '❌'}\n`;
            output += `  Phase 2: ${foundationProgress.phase2Complete ? '✅' : '❌'}\n`;
            output += `  Phase 3: ${foundationProgress.phase3Complete ? '✅' : '❌'}\n`;
            output += `  Phase 4: ${foundationProgress.phase4Complete ? '✅' : '❌'}\n`;
            output += `  Phase 5: ${foundationProgress.phase5Complete ? '✅' : '❌'}\n\n`;

            output += '<span class="info">🏆 CHALLENGE RESULTS:</span>\n';
            output += `  Foundation entries: ${Array.isArray(challengeFoundation) ? challengeFoundation.length : 'Object'}\n\n`;

            // Find differences
            const missing = topologyModules.filter(m => !foundationModules.includes(m));
            if (missing.length > 0) {
                output += '<span class="error">❌ MISSING IN FOUNDATION:</span>\n';
                missing.forEach(m => output += `  • ${m}\n`);
                output += '\n';
            }

            // Diagnosis
            if (topologyModules.length >= 16 && foundationModules.length < 16) {
                output += '<span class="warning">🚨 SYNC ISSUE DETECTED!</span>\n';
                output += 'Topology shows completion but Foundation is missing modules.\n';
                output += '\n<span class="success">✅ Click "Fix Sync Issue" to resolve this.</span>';
            } else if (topologyModules.length >= 16 && foundationModules.length >= 16) {
                output += '<span class="success">✅ Both systems show 16+ modules!</span>\n';
                output += 'Data is in sync. If Novice is still locked, the phase flags may need correction.';
            } else {
                output += '<span class="info">ℹ️ You need to complete more Foundation modules.</span>\n';
                output += `Progress: ${Math.max(topologyModules.length, foundationModules.length)}/16 modules`;
            }

            status.innerHTML = output.replace(/\n/g, '<br>');
        }

        function fixSync() {
            const status = document.getElementById('status');
            
            try {
                // Get topology progress (the correct source)
                const topologyProgress = JSON.parse(localStorage.getItem('topologyProgress') || '{}');
                const topologyModules = topologyProgress.completedModules || [];
                
                // Get challenge results (also a valid source)
                const challengeResults = JSON.parse(localStorage.getItem('challenge_results') || '{}');
                const challengeFoundation = Array.isArray(challengeResults.foundation) 
                    ? challengeResults.foundation.map(c => c.id) 
                    : [];

                // Merge both sources to get all completed modules
                const allCompleted = [...new Set([...topologyModules, ...challengeFoundation])];

                // Get foundation progress
                const foundationProgress = JSON.parse(localStorage.getItem('foundation_progress') || '{}');

                status.innerHTML = '<span class="info">🔄 Syncing data...</span><br><br>';

                // Update foundation progress with complete module list
                foundationProgress.completedModules = allCompleted;

                // Count modules per phase
                const phase1Modules = ['meet-pc', 'meet-switch', 'meet-router'];
                const phase2Modules = ['pc-to-pc', 'pc-to-switch', 'switch-to-router'];
                const phase3Modules = ['small-office', 'home-network', 'network-expansion'];
                const phase4Modules = ['point-to-point-topology', 'bus-topology', 'star-topology'];
                const phase5Modules = ['ring-topology', 'tree-topology', 'mesh-topology', 'hybrid-topology'];

                const phase1Count = phase1Modules.filter(m => allCompleted.includes(m)).length;
                const phase2Count = phase2Modules.filter(m => allCompleted.includes(m)).length;
                const phase3Count = phase3Modules.filter(m => allCompleted.includes(m)).length;
                const phase4Count = phase4Modules.filter(m => allCompleted.includes(m)).length;
                const phase5Count = phase5Modules.filter(m => allCompleted.includes(m)).length;

                // Set phase completion flags
                foundationProgress.phase1Complete = phase1Count >= 3;
                foundationProgress.phase2Complete = phase2Count >= 3;
                foundationProgress.phase3Complete = phase3Count >= 3;
                foundationProgress.phase4Complete = phase4Count >= 3;
                foundationProgress.phase5Complete = phase5Count >= 4;

                foundationProgress.phase1Completed = phase1Count;
                foundationProgress.phase2Completed = phase2Count;
                foundationProgress.phase3Completed = phase3Count;
                foundationProgress.phase4Completed = phase4Count;
                foundationProgress.phase5Completed = phase5Count;

                // Save updated foundation progress
                localStorage.setItem('foundation_progress', JSON.stringify(foundationProgress));

                let output = '<span class="success">✅ SYNC COMPLETE!</span><br><br>';
                output += `📊 Total modules: ${allCompleted.length}<br>`;
                output += `Phase 1: ${phase1Count}/3 ${foundationProgress.phase1Complete ? '✅' : '❌'}<br>`;
                output += `Phase 2: ${phase2Count}/3 ${foundationProgress.phase2Complete ? '✅' : '❌'}<br>`;
                output += `Phase 3: ${phase3Count}/3 ${foundationProgress.phase3Complete ? '✅' : '❌'}<br>`;
                output += `Phase 4: ${phase4Count}/3 ${foundationProgress.phase4Complete ? '✅' : '❌'}<br>`;
                output += `Phase 5: ${phase5Count}/4 ${foundationProgress.phase5Complete ? '✅' : '❌'}<br><br>`;

                // If all 16 modules complete, unlock Novice
                if (allCompleted.length >= 16) {
                    const difficultyUnlocks = JSON.parse(localStorage.getItem('difficulty_unlocks') || '{}');
                    difficultyUnlocks.easy = true;
                    difficultyUnlocks.novice = true;
                    localStorage.setItem('difficulty_unlocks', JSON.stringify(difficultyUnlocks));

                    if (!challengeResults.foundation || Array.isArray(challengeResults.foundation)) {
                        challengeResults.foundation = {
                            status: 'completed',
                            completedAt: new Date().toISOString(),
                            totalModules: 16,
                            completedModules: allCompleted.length
                        };
                        localStorage.setItem('challenge_results', JSON.stringify(challengeResults));
                    }

                    output += '<span class="success">🔓 NOVICE AREA UNLOCKED!</span><br><br>';
                    output += '✅ Click "Back to RiddleNet" and refresh the page to see changes.';
                } else {
                    output += `<span class="warning">⏳ Need ${16 - allCompleted.length} more modules to unlock Novice</span>`;
                }

                status.innerHTML = output;

            } catch (error) {
                status.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
            }
        }

        function goBack() {
            window.location.href = '/troubleshooting';
        }

        // Auto-check on load
        window.addEventListener('load', checkStatus);
    </script>
</body>
</html>
