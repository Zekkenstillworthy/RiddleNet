<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Create Account | RiddleNet</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"/>
    <link rel="icon" href="{{ url_for('static', filename='img/Logo.png') }}">
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");
        @import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap");
        
        :root {
            /* Modern Gaming Network Theme */
            --primary-color: #0F172A;
            --secondary-color: #1E293B;
            --accent-color: #3B82F6;
            --success-color: #10B981;
            --warning-color: #F59E0B;
            --danger-color: #EF4444;
            --cyber-glow: #00D9FF;
            --neon-green: #39FF14;
            --network-purple: #8B5CF6;
            
            /* Background & Surface Colors */
            --background: #020617;
            --surface: #0F172A;
            --surface-hover: #1E293B;
            --border-color: rgba(59, 130, 246, 0.2);
            --glass-bg: rgba(15, 23, 42, 0.8);
            --glass-border: rgba(0, 217, 255, 0.15);
            
            /* Text Colors */
            --text-primary: #F8FAFC;
            --text-secondary: #CBD5E1;
            --text-muted: #64748B;
            
            /* Effects */
            --gradient-primary: linear-gradient(135deg, var(--cyber-glow), var(--network-purple));
            --gradient-secondary: linear-gradient(135deg, var(--neon-green), var(--cyber-glow));
            --shadow-lg: 0 25px 50px -12px rgba(26, 35, 126, 0.8);
            --shadow-glow: 0 0 20px rgba(59, 130, 246, 0.3);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--background);
            background-image: 
                radial-gradient(circle at 75% 75%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 25% 25%, rgba(0, 217, 255, 0.08) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            position: relative;
            overflow: hidden;
        }

        /* Network Grid Background Animation */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(59, 130, 246, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .signup-container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 50px 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: var(--shadow-lg);
            position: relative;
            z-index: 1;
            transform: translateY(-20px);
        }

        .signup-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--gradient-primary);
            border-radius: 24px;
            padding: 2px;
            z-index: -1;
            opacity: 0.3;
        }

        .signup-container h1 {
            font-family: 'Orbitron', monospace;
            font-size: 32px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 10px;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
        }

        .signup-container h1::before {
            content: '🔐';
            position: absolute;
            left: 50%;
            top: -50px;
            transform: translateX(-50%);
            font-size: 40px;
            filter: drop-shadow(0 0 10px var(--cyber-glow));
        }

        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 40px;
            font-size: 14px;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: 500;
            border: 1px solid;
        }

        .alert-success {
            background-color: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
            color: var(--success-color);
        }

        .alert-error {
            background-color: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: var(--danger-color);
        }

        .input-box {
            position: relative;
            margin-bottom: 25px;
        }

        .input-box input {
            width: 100%;
            padding: 16px 50px 16px 20px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .input-box input:focus {
            outline: none;
            border-color: var(--cyber-glow);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.2);
            background: rgba(30, 41, 59, 0.9);
        }

        .input-box input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        .input-box i {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 18px;
            transition: color 0.3s ease;
        }

        .input-box input:focus + i {
            color: var(--cyber-glow);
        }

        .password-requirements {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 5px;
            line-height: 1.4;
        }

        button {
            width: 100%;
            padding: 16px;
            background: var(--gradient-primary);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin-top: 10px;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .login-link {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .login-link p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .login-link a {
            color: var(--cyber-glow);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .login-link a:hover {
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
        }

        /* Cyber effect animations */
        @keyframes dataFlow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .signup-container::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--gradient-primary);
            opacity: 0.6;
            animation: dataFlow 3s ease-in-out infinite;
        }

        /* Responsive design */
        @media (max-width: 480px) {
            .signup-container {
                width: 90%;
                padding: 30px 20px;
            }
            
            .signup-container h1 {
                font-size: 28px;
            }
        }

        /* Form validation styling */
        .input-box input:valid {
            border-color: var(--success-color);
        }

        .input-box input:invalid:not(:placeholder-shown) {
            border-color: var(--danger-color);
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <h1>Admin Create Account</h1>
        <p class="subtitle">Create a new administrator account</p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form method="POST" id="signupForm">
            <div class="input-box">
                <input type="text" name="username" placeholder="Username" required autocomplete="off" minlength="3">
                <i class='bx bxs-user'></i>
            </div>
            
            <div class="input-box">
                <input type="email" name="email" placeholder="Email Address" required autocomplete="email">
                <i class='bx bxs-envelope'></i>
            </div>
            
            <div class="input-box">
                <input type="password" name="password" placeholder="Password" required minlength="8" id="password">
                <i class='bx bxs-lock-alt'></i>
            </div>
            
            <div class="input-box">
                <input type="password" name="confirm_password" placeholder="Confirm Password" required minlength="8" id="confirmPassword">
                <i class='bx bxs-lock-open'></i>
            </div>
            
            <button type="submit" id="submitBtn">Create Admin Account</button>
        </form>
        
        <div class="login-link">
            <p>Already have an admin account? <a href="/instructor/login">Sign In</a></p>
        </div>
        
        <div class="back-to-main" style="text-align: center; margin-top: 20px;">
            <a href="{{ url_for('auth.landing') }}" style="color: var(--text-secondary); text-decoration: none; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; transition: all 0.3s ease;">
                <i class="fas fa-arrow-left"></i> Back to Landing Page
            </a>
        </div>
    </div>

    <script>
        // Simple password matching validation
        document.addEventListener('DOMContentLoaded', function() {
            const password = document.getElementById('password');
            const confirmPassword = document.getElementById('confirmPassword');
            const form = document.getElementById('signupForm');

            function validatePasswords() {
                if (password.value !== confirmPassword.value) {
                    confirmPassword.setCustomValidity('Passwords do not match');
                    return false;
                } else {
                    confirmPassword.setCustomValidity('');
                    return true;
                }
            }

            confirmPassword.addEventListener('input', validatePasswords);

            form.addEventListener('submit', function(e) {
                if (!validatePasswords()) {
                    e.preventDefault();
                    alert('Passwords do not match!');
                    return false;
                }
            });
        });
    </script>
</body>
</html>
