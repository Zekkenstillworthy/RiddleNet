<!-- 
    Continue Game Modal Component - MVP
    Reusable modal for all challenges that ask users to continue or start fresh
    
    Usage: Include this in any challenge template, then call:
      window.challengeProgress.checkForProgress() on page load
-->

<!-- Continue Game Modal -->
<div id="continueGameModal" class="continue-modal" style="display: none;">
    <div class="continue-modal-content">
        <div class="continue-icon">
            <i class="fas fa-play-circle"></i>
        </div>
        <h2>Welcome Back!</h2>
        <p class="continue-message">You have unfinished progress in this challenge.</p>
        <p class="continue-date">Last played: <span id="lastPlayedDate">--</span></p>
        
        <div class="continue-actions">
            <button class="continue-btn primary" onclick="continueSavedGame()">
                <i class="fas fa-play"></i>
                Continue Game
            </button>
            <button class="continue-btn secondary" onclick="startNewGame()">
                <i class="fas fa-redo"></i>
                Start Fresh
            </button>
        </div>
        
        <button class="continue-close" onclick="closeContinueModal()" aria-label="Close modal">
            <i class="fas fa-times"></i>
        </button>
    </div>
</div>

<style>
