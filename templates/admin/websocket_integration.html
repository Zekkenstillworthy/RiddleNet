<!-- Enhanced Admin WebSocket Integration Template -->
<!-- Add this to the bottom of admin layout templates or specific admin pages -->

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Check if we're on an admin page and AdminWebSocketManager is available
    if (window.location.pathname.includes('/admin') && window.adminWebSocketManager) {
        console.log('🔌 Admin WebSocket integration template loaded');
        
        // Get reference to the admin WebSocket manager
        const adminWS = window.adminWebSocketManager;
        
        // ===== PAGE-SPECIFIC INTEGRATIONS =====
        
        // Dashboard Integration
        if (adminWS.currentPage === 'dashboard') {
            setupDashboardIntegration(adminWS);
        }
        
        // Content Management Integration
        if (adminWS.currentPage === 'content-management') {
            setupContentManagementIntegration(adminWS);
        }
        
        // User Management Integration
        if (adminWS.currentPage === 'user-management') {
            setupUserManagementIntegration(adminWS);
        }
        
        // Simulation Builder Integration
        if (adminWS.currentPage === 'simulation-builder') {
            setupSimulationBuilderIntegration(adminWS);
        }
        
        // Notifications Integration
        if (adminWS.currentPage === 'notifications') {
            setupNotificationIntegration(adminWS);
        }
        
        // Analytics Integration
        if (adminWS.currentPage === 'analytics') {
            setupAnalyticsIntegration(adminWS);
        }
        
        // WebSocket Debug Integration
        if (adminWS.currentPage === 'websocket-debug') {
            setupWebSocketDebugIntegration(adminWS);
        }
    }
});

// ===== DASHBOARD INTEGRATION FUNCTIONS =====
function setupDashboardIntegration(adminWS) {
    console.log('📊 Setting up dashboard WebSocket integration');
    
    // Update dashboard statistics
    adminWS.updateDashboardStats = function(data) {
        console.log('📊 Updating dashboard stats:', data);
        
        // Update stat cards
        updateStatCard('total-users', data.total_users);
        updateStatCard('active-users', data.active_users);
        updateStatCard('total-classes', data.total_classes);
        updateStatCard('pending-submissions', data.pending_submissions);
        
        // Update system load indicator
        updateSystemLoadIndicator(data.system_load);
    };
    
    // Update active users list
    adminWS.updateActiveUsers = function(data) {
        console.log('👥 Updating active users:', data);
        
        const usersList = document.getElementById('active-users-list');
        if (usersList && data.users) {
            usersList.innerHTML = data.users.map(user => `
                <div class="user-item d-flex align-items-center mb-2">
                    <img src="${user.profile_img || '/static/img/default-avatar.png'}" 
                         class="rounded-circle me-2" width="32" height="32" alt="${user.username}">
                    <div>
                        <div class="fw-bold">${user.username}</div>
                        <small class="text-muted">${user.current_activity || 'Dashboard'}</small>
                    </div>
                    <span class="badge bg-success ms-auto">Online</span>
                </div>
            `).join('');
        }
    };
    
    // Add activity to feed
    adminWS.addActivityToFeed = function(data) {
        console.log('📝 Adding activity to feed:', data);
        
        const activityFeed = document.getElementById('activity-feed');
        if (activityFeed) {
            const activityItem = document.createElement('div');
            activityItem.className = 'activity-item border-bottom pb-2 mb-2';
            activityItem.innerHTML = `
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <div class="fw-bold">${data.description}</div>
                        <small class="text-muted">by ${data.user}</small>
                    </div>
                    <small class="text-muted">${formatTimeAgo(data.timestamp)}</small>
                </div>
            `;
            activityFeed.insertBefore(activityItem, activityFeed.firstChild);
            
            // Keep only latest 20 items
            while (activityFeed.children.length > 20) {
                activityFeed.removeChild(activityFeed.lastChild);
            }
        }
    };
    
    // Listen for dashboard-specific events
    adminWS.on('dashboard_stats_update', adminWS.updateDashboardStats);
    adminWS.on('active_users_update', adminWS.updateActiveUsers);
    adminWS.on('recent_activity_update', adminWS.addActivityToFeed);
}

// ===== CONTENT MANAGEMENT INTEGRATION FUNCTIONS =====
function setupContentManagementIntegration(adminWS) {
    console.log('📝 Setting up content management WebSocket integration');
    
    // Auto-save indicator
    adminWS.showAutoSaveIndicator = function(data) {
        console.log('💾 Content auto-saved:', data);
        
        const indicator = document.getElementById('auto-save-indicator') || createAutoSaveIndicator();
        indicator.textContent = `Auto-saved at ${new Date().toLocaleTimeString()}`;
        indicator.className = 'badge bg-success';
        
        setTimeout(() => {
            indicator.className = 'badge bg-secondary';
        }, 3000);
    };
    
    // Concurrent edit warning
    adminWS.showConcurrentEditWarning = function(data) {
        console.log('⚠️ Concurrent edit warning:', data);
        
        showToast('Concurrent Edit Warning', 
                 `${data.editor} is also editing this content`, 
                 'warning');
    };
    
    // Content published notification
    adminWS.handleContentPublished = function(data) {
        console.log('📤 Content published:', data);
        
        showToast('Content Published', 
                 `${data.content_type} has been published`, 
                 'success');
        
        // Refresh content list if needed
        if (typeof refreshContentList === 'function') {
            refreshContentList();
        }
    };
    
    // Listen for content management events
    adminWS.on('content_auto_saved_broadcast', adminWS.showAutoSaveIndicator);
    adminWS.on('concurrent_edit_warning', adminWS.showConcurrentEditWarning);
    adminWS.on('content_published_broadcast', adminWS.handleContentPublished);
    
    // Set up auto-save for forms
    setupAutoSave(adminWS);
}

// ===== USER MANAGEMENT INTEGRATION FUNCTIONS =====
function setupUserManagementIntegration(adminWS) {
    console.log('👥 Setting up user management WebSocket integration');
    
    // Handle user login events
    adminWS.handleUserLogin = function(data) {
        console.log('👤 User logged in:', data);
        
        // Update user status in table if visible
        updateUserStatusInTable(data.user_id, 'online');
        
        // Show notification
        showToast('User Login', 
                 `${data.username} has logged in`, 
                 'info');
    };
    
    // Handle user logout events
    adminWS.handleUserLogout = function(data) {
        console.log('👤 User logged out:', data);
        
        // Update user status in table if visible
        updateUserStatusInTable(data.user_id, 'offline');
    };
    
    // Handle progress milestones
    adminWS.handleProgressMilestone = function(data) {
        console.log('🏆 Progress milestone:', data);
        
        showToast('Progress Milestone', 
                 `${data.username} reached a new milestone: ${data.milestone}`, 
                 'success');
    };
    
    // Listen for user management events
    adminWS.on('user_login', adminWS.handleUserLogin);
    adminWS.on('user_logout', adminWS.handleUserLogout);
    adminWS.on('user_progress_milestone', adminWS.handleProgressMilestone);
    adminWS.on('user_status_changed_broadcast', function(data) {
        console.log('👤 User status changed:', data);
        showToast('User Status Updated', 
                 `User ${data.user_id} status changed to ${data.new_status}`, 
                 'info');
    });
}

// ===== SIMULATION BUILDER INTEGRATION FUNCTIONS =====
function setupSimulationBuilderIntegration(adminWS) {
    console.log('🏗️ Setting up simulation builder WebSocket integration');
    
    // Simulation auto-save
    adminWS.showSimulationAutoSave = function(data) {
        console.log('💾 Simulation auto-saved:', data);
        
        const indicator = document.getElementById('simulation-auto-save-indicator') || createAutoSaveIndicator();
        indicator.textContent = `Simulation auto-saved at ${new Date().toLocaleTimeString()}`;
        indicator.className = 'badge bg-success';
        
        setTimeout(() => {
            indicator.className = 'badge bg-secondary';
        }, 3000);
    };
    
    // Simulation validation
    adminWS.showSimulationValidation = function(data) {
        console.log('✅ Simulation validation:', data);
        
        const validationIcon = data.is_valid ? '✅' : '❌';
        const validationType = data.is_valid ? 'success' : 'danger';
        
        showToast('Simulation Validation', 
                 `${validationIcon} Simulation validation ${data.is_valid ? 'passed' : 'failed'}`, 
                 validationType);
    };
    
    // Component library update
    adminWS.updateComponentLibrary = function(data) {
        console.log('🧩 Component library updated:', data);
        
        // Refresh component library if function exists
        if (typeof refreshComponentLibrary === 'function') {
            refreshComponentLibrary();
        }
        
        showToast('Components Updated', 
                 'New simulation components are available', 
                 'info');
    };
    
    // Listen for simulation builder events
    adminWS.on('simulation_auto_saved_broadcast', adminWS.showSimulationAutoSave);
    adminWS.on('simulation_validated_broadcast', adminWS.showSimulationValidation);
    adminWS.on('component_library_updated', adminWS.updateComponentLibrary);
}

// ===== NOTIFICATION INTEGRATION FUNCTIONS =====
function setupNotificationIntegration(adminWS) {
    console.log('🔔 Setting up notification WebSocket integration');
    
    // Update notification status
    adminWS.updateNotificationStatus = function(data) {
        console.log('🔔 Notification status update:', data);
        
        const notificationElement = document.querySelector(`[data-notification-id="${data.notification_id}"]`);
        if (notificationElement) {
            const statusBadge = notificationElement.querySelector('.notification-status');
            if (statusBadge) {
                statusBadge.textContent = data.status;
                statusBadge.className = `badge bg-${getStatusColor(data.status)}`;
            }
        }
    };
    
    // Mark notification as read
    adminWS.markNotificationRead = function(data) {
        console.log('👁️ Notification marked as read:', data);
        
        const notificationElement = document.querySelector(`[data-notification-id="${data.notification_id}"]`);
        if (notificationElement) {
            notificationElement.classList.add('notification-read');
        }
    };
    
    // Update notification statistics
    adminWS.updateNotificationStats = function(data) {
        console.log('📊 Notification stats update:', data);
        
        updateStatCard('total-notifications', data.total_notifications);
        updateStatCard('unread-notifications', data.unread_notifications);
        updateStatCard('delivery-rate', data.notification_delivery_rate + '%');
    };
    
    // Listen for notification events
    adminWS.on('notification_delivered', adminWS.updateNotificationStatus);
    adminWS.on('notification_read', adminWS.markNotificationRead);
    adminWS.on('notification_stats_update', adminWS.updateNotificationStats);
}

// ===== ANALYTICS INTEGRATION FUNCTIONS =====
function setupAnalyticsIntegration(adminWS) {
    console.log('📈 Setting up analytics WebSocket integration');
    
    // Update analytics charts
    adminWS.updateAnalyticsCharts = function(data) {
        console.log('📊 Analytics data update:', data);
        
        // Update charts if Chart.js is available
        if (typeof Chart !== 'undefined') {
            updateChartData(data);
        }
    };
    
    // Show performance alert
    adminWS.showPerformanceAlert = function(data) {
        console.log('🚨 Performance alert:', data);
        
        const alertType = data.severity === 'critical' ? 'danger' : 'warning';
        showToast('Performance Alert', data.message, alertType);
        
        // Update performance indicators
        updatePerformanceIndicators(data);
    };
    
    // Listen for analytics events
    adminWS.on('analytics_data_update', adminWS.updateAnalyticsCharts);
    adminWS.on('performance_alert_broadcast', adminWS.showPerformanceAlert);
}

// ===== WEBSOCKET DEBUG INTEGRATION FUNCTIONS =====
function setupWebSocketDebugIntegration(adminWS) {
    console.log('🔍 Setting up WebSocket debug integration');
    
    // Update WebSocket statistics
    adminWS.updateWebSocketStats = function(data) {
        console.log('🔌 WebSocket stats update:', data);
        
        const statsContainer = document.getElementById('websocket-stats');
        if (statsContainer && data.stats) {
            statsContainer.innerHTML = `
                <div class="row">
                    <div class="col-md-3">
                        <div class="stat-card">
                            <h5>Connected Users</h5>
                            <div class="stat-value">${data.stats.connected_users || 0}</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card">
                            <h5>Active Rooms</h5>
                            <div class="stat-value">${data.stats.active_rooms || 0}</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card">
                            <h5>Messages/Min</h5>
                            <div class="stat-value">${data.stats.messages_per_minute || 0}</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card">
                            <h5>Avg Latency</h5>
                            <div class="stat-value">${data.stats.avg_latency || 0}ms</div>
                        </div>
                    </div>
                </div>
            `;
        }
    };
    
    // Show connection diagnostic
    adminWS.showConnectionDiagnostic = function(data) {
        console.log('🔍 Connection diagnostic:', data);
        
        const diagnosticContainer = document.getElementById('connection-diagnostic');
        if (diagnosticContainer) {
            diagnosticContainer.innerHTML = `
                <div class="diagnostic-result">
                    <h6>Connection Diagnostic Results</h6>
                    <div class="diagnostic-item">
                        <strong>Status:</strong> ${data.results.connection_status}
                    </div>
                    <div class="diagnostic-item">
                        <strong>Latency:</strong> ${data.results.latency}
                    </div>
                    <div class="diagnostic-item">
                        <strong>Transport:</strong> ${data.results.transport}
                    </div>
                    <div class="diagnostic-item">
                        <strong>Rooms:</strong> ${data.results.rooms.join(', ')}
                    </div>
                </div>
            `;
        }
    };
    
    // Listen for WebSocket debug events
    adminWS.on('websocket_stats_updated', adminWS.updateWebSocketStats);
    adminWS.on('connection_diagnostic_results', adminWS.showConnectionDiagnostic);
}

// ===== UTILITY FUNCTIONS =====
function updateStatCard(cardId, value) {
    const card = document.getElementById(cardId);
    if (card) {
        const valueElement = card.querySelector('.stat-value') || card;
        valueElement.textContent = value;
        
        // Add animation
        valueElement.classList.add('stat-updated');
        setTimeout(() => {
            valueElement.classList.remove('stat-updated');
        }, 1000);
    }
}

function updateSystemLoadIndicator(loadPercentage) {
    const indicator = document.getElementById('system-load-indicator');
    if (indicator) {
        indicator.textContent = `${loadPercentage}%`;
        
        // Update color based on load
        indicator.className = 'badge';
        if (loadPercentage < 50) {
            indicator.classList.add('bg-success');
        } else if (loadPercentage < 80) {
            indicator.classList.add('bg-warning');
        } else {
            indicator.classList.add('bg-danger');
        }
    }
}

function createAutoSaveIndicator() {
    const indicator = document.createElement('span');
    indicator.id = 'auto-save-indicator';
    indicator.className = 'badge bg-secondary';
    indicator.textContent = 'Not saved';
    
    // Find a good place to insert it (e.g., near a save button)
    const saveButton = document.querySelector('.btn-save, .save-btn, [type="submit"]');
    if (saveButton && saveButton.parentNode) {
        saveButton.parentNode.insertBefore(indicator, saveButton.nextSibling);
    } else {
        // Fallback: add to body
        document.body.appendChild(indicator);
    }
    
    return indicator;
}

function setupAutoSave(adminWS) {
    // Set up auto-save for forms
    const forms = document.querySelectorAll('form[data-auto-save="true"]');
    
    forms.forEach(form => {
        let autoSaveTimeout;
        
        const inputs = form.querySelectorAll('input, textarea, select');
        inputs.forEach(input => {
            input.addEventListener('input', function() {
                clearTimeout(autoSaveTimeout);
                autoSaveTimeout = setTimeout(() => {
                    autoSaveForm(form, adminWS);
                }, 2000); // Auto-save after 2 seconds of inactivity
            });
        });
    });
}

function autoSaveForm(form, adminWS) {
    const formData = new FormData(form);
    const data = Object.fromEntries(formData);
    
    // Emit auto-save event
    adminWS.emit('content_auto_saved', {
        content_id: form.dataset.contentId || 'unknown',
        content_type: form.dataset.contentType || 'content',
        data: data
    });
}

function updateUserStatusInTable(userId, status) {
    const userRow = document.querySelector(`[data-user-id="${userId}"]`);
    if (userRow) {
        const statusCell = userRow.querySelector('.user-status');
        if (statusCell) {
            statusCell.textContent = status;
            statusCell.className = `badge bg-${status === 'online' ? 'success' : 'secondary'}`;
        }
    }
}

function getStatusColor(status) {
    const colors = {
        'sent': 'primary',
        'delivered': 'success',
        'read': 'info',
        'failed': 'danger',
        'pending': 'warning'
    };
    return colors[status] || 'secondary';
}

function updateChartData(data) {
    // Update Chart.js charts with new data
    if (window.dashboardCharts) {
        Object.keys(window.dashboardCharts).forEach(chartKey => {
            const chart = window.dashboardCharts[chartKey];
            if (chart && data.data[chartKey]) {
                chart.data = data.data[chartKey];
                chart.update();
            }
        });
    }
}

function updatePerformanceIndicators(data) {
    const indicator = document.getElementById(`performance-${data.metric_name.replace('_', '-')}`);
    if (indicator) {
        indicator.textContent = data.current_value;
        indicator.className = `badge bg-${data.severity === 'critical' ? 'danger' : 'warning'}`;
    }
}

function formatTimeAgo(timestamp) {
    const now = new Date();
    const time = new Date(timestamp);
    const diffMs = now - time;
    const diffMins = Math.floor(diffMs / 60000);
    
    if (diffMins < 1) return 'Just now';
    if (diffMins < 60) return `${diffMins}m ago`;
    if (diffMins < 1440) return `${Math.floor(diffMins / 60)}h ago`;
    return `${Math.floor(diffMins / 1440)}d ago`;
}

function showToast(title, message, type = 'info') {
    // Create and show Bootstrap toast
    const toastContainer = document.getElementById('toast-container') || createToastContainer();
    
    const toastHtml = `
        <div class="toast" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="5000">
            <div class="toast-header">
                <i class="fas fa-${getToastIcon(type)} text-${type} me-2"></i>
                <strong class="me-auto">${title}</strong>
                <small class="text-muted">now</small>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body">
                ${message}
            </div>
        </div>
    `;
    
    toastContainer.insertAdjacentHTML('beforeend', toastHtml);
    
    const toastElement = toastContainer.lastElementChild;
    const toast = new bootstrap.Toast(toastElement);
    toast.show();
    
    // Remove toast element after it's hidden
    toastElement.addEventListener('hidden.bs.toast', function() {
        toastElement.remove();
    });
}

function createToastContainer() {
    const container = document.createElement('div');
    container.id = 'toast-container';
    container.className = 'toast-container position-fixed top-0 end-0 p-3';
    container.style.zIndex = '9999';
    document.body.appendChild(container);
    return container;
}

function getToastIcon(type) {
    const icons = {
        'success': 'check-circle',
        'info': 'info-circle',
        'warning': 'exclamation-triangle',
        'danger': 'exclamation-circle',
        'error': 'exclamation-circle'
    };
    return icons[type] || 'info-circle';
}

// Add CSS for animations
const style = document.createElement('style');
style.textContent = `
    .stat-updated {
        animation: statPulse 0.5s ease-in-out;
    }
    
    @keyframes statPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
    }
    
    .stat-card {
        background: #f8f9fa;

        text-align: center;
        margin-bottom: 1rem;
    }
    
    .stat-value {
        font-size: 2rem;
        font-weight: bold;
        color: #495057;
    }
    
    .diagnostic-result {
        background: #f8f9fa;
        border-radius: 8px;
        padding: 1rem;
        margin-top: 1rem;
    }
    
    .diagnostic-item {
        margin-bottom: 0.5rem;
    }
    
    .activity-item:hover {
        background-color: #f8f9fa;
    }
    
    .user-item:hover {
        background-color: #f8f9fa;
    }
    
    .notification-read {
        opacity: 0.7;
    }
`;
document.head.appendChild(style);

console.log('✅ Admin WebSocket integration template loaded successfully');
</script>
