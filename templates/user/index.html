            websocketManager = new WebSocketVisualManager();
            
            // Legacy socket event handlers for compatibility
            if (window.socketClient) {
                // Handle login success notifications
                window.socketClient.on('login_success', function(data) {
                    console.log('Login success notification received:', data);
                });
                
                // Handle logout complete notifications
                window.socketClient.on('logout_complete', function(data) {
                    console.log('Logout complete notification received:', data);
                });
                
                // Handle OTP events
                window.socketClient.on('otp_request_received', function(data) {
                    console.log('OTP request received:', data);
                    const messageElement = document.getElementById('message');
                    if (messageElement) {
                        messageElement.textContent = 'Processing OTP request...';
                        messageElement.className = 'message-container success-message show';
                    }
                });
                
                window.socketClient.on('otp_email_sent', function(data) {
                    console.log('OTP email sent:', data);
                    const messageElement = document.getElementById('message');
                    if (messageElement) {
                        messageElement.textContent = 'OTP sent to your email! Please check your inbox and enter the code.';
                        messageElement.className = 'message-container success-message show';
                    }
                });
                
                window.socketClient.on('otp_email_failed', function(data) {
                    console.log('OTP email failed:', data);
                    const messageElement = document.getElementById('message');
                    if (messageElement) {
                        messageElement.textContent = data.message || 'Failed to send OTP email. Please try again.';
                        messageElement.className = 'message-container error-message show';
                    }
                });
            }
        });

        // Password visibility toggle functionality
        function setupPasswordToggle(toggleId, inputId) {
            const toggleBtn = document.getElementById(toggleId);
            const passwordInput = document.getElementById(inputId);

            if (toggleBtn && passwordInput) {
                toggleBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    // Toggle password visibility
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    
                    // Toggle icon
                    if (type === 'text') {
                        this.classList.remove('bx-show');
                        this.classList.add('bx-hide');
                        this.setAttribute('title', 'Hide password');
                        this.style.color = 'var(--cyber-glow)';
                    } else {
                        this.classList.remove('bx-hide');
                        this.classList.add('bx-show');
                        this.setAttribute('title', 'Show password');
                        this.style.color = 'rgba(255, 255, 255, 0.5)';
                    }
                });

                // Hover effect
                toggleBtn.addEventListener('mouseenter', function() {
                    if (passwordInput.getAttribute('type') === 'password') {
                        this.style.color = 'var(--cyber-glow)';
                    }
                });

                toggleBtn.addEventListener('mouseleave', function() {
                    if (passwordInput.getAttribute('type') === 'password') {
                        this.style.color = 'rgba(255, 255, 255, 0.5)';
                    }
                });
            }
        }

        // Initialize password toggles for both login and signup forms
        setupPasswordToggle('toggleLoginPassword', 'loginPassword');
        setupPasswordToggle('toggleSignupPassword', 'signupPassword');
    </script>
