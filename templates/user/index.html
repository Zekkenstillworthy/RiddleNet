<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In or Sign Up | RiddleNet</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="icon" href="{{ url_for('static', filename='img/Logo.png') }}">
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");
        @import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap");
        @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap");
        
        :root {
            /* Modern Gaming Network Theme - Matching instructor Dashboard */
            --primary-color: #0F172A;
            --secondary-color: #1E293B;
            --accent-color: #3B82F6;
            --success-color: #10B981;
            --warning-color: #F59E0B;
            --danger-color: #EF4444;
            --cyber-glow: #00D9FF;
            --neon-green: #39FF14;
            --network-purple: #8B5CF6;
            
            /* Background & Surface Colors */
            --background: #020617;
            --surface: #0F172A;
            --surface-hover: #1E293B;
            --border-color: rgba(59, 130, 246, 0.2);
            --glass-bg: rgba(15, 23, 42, 0.8);
            --glass-border: rgba(0, 217, 255, 0.15);
            
            /* Text Colors */
            --text-primary: #F8FAFC;
            --text-secondary: #CBD5E1;
            --text-muted: #64748B;
            
            /* Effects */
            --gradient-primary: linear-gradient(135deg, var(--cyber-glow), var(--network-purple));
            --gradient-secondary: linear-gradient(135deg, var(--neon-green), var(--cyber-glow));
            --shadow-lg: 0 25px 50px -12px rgba(26, 35, 126, 0.8);
            --shadow-glow: 0 0 20px rgba(59, 130, 246, 0.3);
            --transition-speed: 0.4s;
            --border-radius: 12px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--background);
            background-image: 
                radial-gradient(circle at 75% 75%, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Network Grid Background Animation - Matching instructor Dashboard */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: 
                linear-gradient(90deg, rgba(59, 130, 246, 0.03) 1px, transparent 1px),
                linear-gradient(rgba(59, 130, 246, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: -1;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            100% { transform: translate(50px, 50px); }
        }

        /* Floating Network Nodes */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 20%, rgba(0, 217, 255, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 40% 60%, rgba(57, 255, 20, 0.05) 0%, transparent 30%);
            pointer-events: none;
            z-index: -2;
        }        /* Main Container - Gamified Design Matching instructor Dashboard */
        .auth-container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 0;
            width: 900px;
            max-width: 95vw;
            height: 600px;
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
            display: flex;
            transition: all var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1);
        }

        .auth-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gradient-primary);
            animation: neonPulse 3s ease-in-out infinite;
            z-index: 3;
        }

        .auth-container:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg), var(--shadow-glow);
            border-color: var(--cyber-glow);
        }

        @keyframes neonPulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }        /* Form Panels */
        .form-panel {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(15, 23, 42, 0.3);
            backdrop-filter: blur(10px);
        }        .form-panel.signin {
            left: 0;
            opacity: 1;
            transform: translateX(0);
            z-index: 3;
        }

        .form-panel.signup {
            right: 0;
            opacity: 0;
            transform: translateX(100%);
            z-index: 2;
        }

        .auth-container.signup-mode .form-panel.signin {
            opacity: 0;
            transform: translateX(-100%);
            z-index: 2;
        }

        .auth-container.signup-mode .form-panel.signup {
            opacity: 1;
            transform: translateX(0);
            z-index: 3;
        }/* Logo Styling */
        
        .logo {
    width: 120px;
    height: 120px;
    margin-bottom: 30px;
    filter: drop-shadow(var(--shadow-glow));
    transition: all 0.3s ease;
    display: block;
    margin-left: auto;
    margin-right: auto;
}

        .logo:hover {
            transform: scale(1.05) rotate(3deg);
            filter: drop-shadow(0 0 30px rgba(0, 217, 255, 0.6));
        }

        /* QR Code Styling */
        .qr-code-container {
            margin-bottom: 20px;
            text-align: center;
        }

        .qr-code {
            width: 100px;
            height: 100px;
            border-radius: 12px;
            border: 2px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.1);
            padding: 8px;
            transition: all 0.3s ease;
        }

        .qr-code:hover {
            transform: scale(1.05);
            border-color: var(--cyber-glow);
            box-shadow: var(--shadow-glow);
        }        /* Typography - Matching instructor Dashboard */
        .form-title {
            font-family: 'Orbitron', monospace;
            font-size: 28px;
            font-weight: 600;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            text-align: center;
        }

        .form-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 32px;
            text-align: center;
        }

        /* Input Styling - Matching instructor Dashboard */
        .input-group {
            width: 100%;
            max-width: 320px;
            margin-bottom: 16px;
            position: relative;
        }

        .input-field {
            width: 100%;
            height: 48px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: var(--border-radius);
            padding: 0 16px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--cyber-glow);
            background: rgba(15, 23, 42, 0.8);
            box-shadow: var(--shadow-glow);
            transform: translateY(-2px);
        }

        .input-field::placeholder {
            color: var(--text-muted);
        }        /* OTP Section */
        .otp-section {
            width: 100%;
            max-width: 320px;
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .otp-input {
            flex: 1;
        }

        .otp-btn {
            padding: 0 16px;
            background: var(--gradient-primary);
            border: none;
            border-radius: var(--border-radius);
            color: white;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            white-space: nowrap;
        }

        .otp-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .otp-btn:hover::before {
            left: 100%;
        }

        .otp-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        /* Timer */
        .otp-timer {
            margin-top: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--cyber-glow);
            text-align: center;
            display: none;
        }        /* Primary Button - Matching instructor Dashboard */
        .btn-primary {
            width: 100%;
            max-width: 320px;
            height: 48px;
            background: var(--gradient-primary);
            border: none;
            border-radius: var(--border-radius);
            color: white;
            font-family: 'Orbitron', monospace;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            margin-top: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-glow);
        }

        .btn-primary:active {
            transform: translateY(-1px);
        }        /* Side Panel */
        .side-panel {
            width: 50%;
            background: linear-gradient(135deg, 
                rgba(24, 34, 113, 0.95) 0%, 
                rgba(59, 130, 246, 0.95) 50%,
                rgba(24, 34, 113, 0.95) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 40px;
            text-align: center;
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            overflow: hidden;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.2);
        }

        .side-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 20%, rgba(255,255,255,0.2) 2px, transparent 2px),
                radial-gradient(circle at 80% 80%, rgba(255,255,255,0.15) 1px, transparent 1px),
                linear-gradient(45deg, transparent 49%, rgba(255,255,255,0.05) 50%, transparent 51%);
            background-size: 100px 100px, 60px 60px, 40px 40px;
            animation: patternMove 20s linear infinite;
            opacity: 0.6;
        }        .auth-container.signup-mode .side-panel {
            transform: translateX(-100%);
        }

        .panel-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .panel-title {
            font-family: 'Orbitron', monospace;
            font-size: 36px;
            font-weight: 700;
            color: white;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
            letter-spacing: 2px;
        }

        .panel-subtitle {
            color: rgba(255, 255, 255, 0.95);
            font-size: 18px;
            margin-bottom: 40px;
            line-height: 1.6;
            max-width: 300px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50px;
            color: white;
            padding: 14px 32px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            backdrop-filter: blur(10px);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: white;
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }/* Message Container */
        .message-container {
            width: 100%;
            max-width: 320px;
            padding: 12px 16px;
            margin: 16px 0;
            border-radius: var(--border-radius);
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid transparent;
            position: relative;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            display: none;
        }

        .message-container.show {
            opacity: 1;
            transform: translateY(0);
            display: block;
        }

        .message-container.error-message {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: var(--danger-color);
        }

        .message-container.success-message {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
            color: var(--success-color);
        }

        .message-container.warning-message {
            background: rgba(245, 158, 11, 0.1);
            border-color: rgba(245, 158, 11, 0.3);
            color: var(--warning-color);
        }        /* Responsive Design - Mobile First Approach */
        
        /* Tablet Devices (768px - 1024px) */
        @media (max-width: 1024px) and (min-width: 769px) {
            .auth-container {
                width: 90vw;
                max-width: 800px;
            }
            
            .form-panel {
                padding: 35px;
            }
            
            .input-group {
                max-width: 280px;
            }
            
            .back-to-landing {
                top: 15px;
                left: 15px;
                padding: 10px 16px;
                font-size: 13px;
            }
        }
        
        /* Mobile Devices (max-width: 768px) */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .back-to-landing {
                top: 10px;
                left: 10px;
                padding: 8px 12px;
                font-size: 12px;
            }
            
            .back-to-landing span {
                display: none;
            }
            
            .back-to-landing i {
                font-size: 18px;
            }
            
            .auth-container {
                width: 100%;
                max-width: 100%;
                height: auto;
                min-height: 500px;
                flex-direction: column;
                padding: 0;
                border-radius: 16px;
            }

            .form-panel {
                width: 100%;
                height: auto;
                min-height: 380px;
                padding: 25px 20px;
                position: relative;
                transform: none !important;
                opacity: 1 !important;
            }

            .form-panel.signup {
                display: none;
            }

            .auth-container.signup-mode .form-panel.signin {
                display: none;
            }

            .auth-container.signup-mode .form-panel.signup {
                display: flex;
            }

            .side-panel {
                width: 100%;
                height: 160px;
                padding: 20px;
                order: -1;
                position: relative;
                left: 0;
                transform: none !important;
            }

            .logo {
                width: 70px;
                height: 70px;
                margin-bottom: 15px;
            }

            .form-title {
                font-size: 22px;
                margin-bottom: 6px;
            }
            
            .form-subtitle {
                font-size: 13px;
                margin-bottom: 24px;
            }

            .panel-title {
                font-size: 22px;
                margin-bottom: 12px;
            }
            
            .panel-subtitle {
                font-size: 14px;
                margin-bottom: 20px;
            }

            .input-group {
                max-width: 100%;
                margin-bottom: 14px;
            }
            
            .input-field {
                height: 44px;
                font-size: 15px;
                padding: 0 14px;
            }

            .btn-primary {
                max-width: 100%;
                height: 44px;
                font-size: 13px;
                margin-top: 12px;
            }
            
            .btn-secondary {
                padding: 12px 28px;
                font-size: 14px;
            }

            .otp-section {
                max-width: 100%;
                flex-direction: column;
                gap: 12px;
            }

            .otp-input {
                flex: none;
            }
            
            .otp-btn {
                padding: 12px 16px;
                font-size: 12px;
            }

            .qr-code {
                width: 70px;
                height: 70px;
            }
            
            .message-container {
                max-width: 100%;
                font-size: 12px;
                padding: 10px 14px;
                margin: 12px 0;
            }
        }
        
        /* Small Mobile Devices (max-width: 480px) */
        @media (max-width: 480px) {
            body {
                padding: 5px;
            }
            
            .auth-container {
                border-radius: 12px;
                min-height: 450px;
            }
            
            .form-panel {
                padding: 20px 15px;
                min-height: 340px;
            }
            
            .side-panel {
                height: 140px;
                padding: 15px;
            }
            
            .logo {
                width: 60px;
                height: 60px;
                margin-bottom: 12px;
            }
            
            .form-title {
                font-size: 20px;
            }
            
            .panel-title {
                font-size: 20px;
                margin-bottom: 10px;
            }
            
            .panel-subtitle {
                font-size: 13px;
                margin-bottom: 15px;
            }
            
            .input-field {
                height: 42px;
                font-size: 14px;
            }
            
            .btn-primary {
                height: 42px;
                font-size: 12px;
            }
            
            .btn-secondary {
                padding: 10px 24px;
                font-size: 13px;
            }
            
            .qr-code {
                width: 60px;
                height: 60px;
            }
        }
        
        /* Extra Small Mobile (max-width: 375px) */
        @media (max-width: 375px) {
            .form-title {
                font-size: 18px;
            }
            
            .panel-title {
                font-size: 18px;
            }
            
            .input-field {
                height: 40px;
                font-size: 13px;
            }
            
            .btn-primary {
                height: 40px;
            }
        }

        /* Loading Animation */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid currentColor;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        /* Back to Landing Page Button */
        .back-to-landing {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 217, 255, 0.3);
            border-radius: 25px;
            color: var(--cyber-glow);
            text-decoration: none;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            z-index: 1000;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .back-to-landing:hover {
            background: rgba(0, 217, 255, 0.1);
            border-color: var(--cyber-glow);
            transform: translateX(-5px);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
        }

        .back-to-landing i {
            font-size: 20px;
        }

        .back-to-landing span {
            display: inline;
        }        /* Enhanced WebSocket Connection Status Indicator */
        .websocket-status {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 217, 255, 0.3);
            border-radius: 25px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            z-index: 1000;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
        }

        .websocket-status.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        /* Authentication States with Clear Visual Hierarchy */
        .websocket-status.authenticated {
            border-color: var(--success-color);
            color: var(--success-color);
            background: rgba(16, 185, 129, 0.1);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
        }

        .websocket-status.network-connected {
            border-color: rgba(0, 217, 255, 0.5);
            color: rgba(0, 217, 255, 0.8);
            background: rgba(0, 217, 255, 0.05);
        }

        .websocket-status.awaiting-auth {
            border-color: var(--warning-color);
            color: var(--warning-color);
            background: rgba(245, 158, 11, 0.08);
        }

        .websocket-status.connecting {
            border-color: var(--cyber-glow);
            color: var(--cyber-glow);
            background: rgba(0, 217, 255, 0.05);
        }

        .websocket-status.disconnected {
            border-color: var(--danger-color);
            color: var(--danger-color);
            background: rgba(239, 68, 68, 0.1);
        }

        /* Hide status on login page unless there's a critical connection issue */
        .websocket-status.login-page-hidden {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
        }

        .connection-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: all 0.4s ease;
            position: relative;
        }

        /* Enhanced connection indicator states */
        .websocket-status.authenticated .connection-indicator {
            background: var(--success-color);
            box-shadow: 
                0 0 8px var(--success-color),
                0 0 16px rgba(16, 185, 129, 0.4);
            animation: authenticatedPulse 2s infinite;
        }

        .websocket-status.network-connected .connection-indicator {
            background: rgba(0, 217, 255, 0.8);
            box-shadow: 
                0 0 6px rgba(0, 217, 255, 0.6),
                0 0 12px rgba(0, 217, 255, 0.3);
            animation: networkPulse 2s infinite;
        }

        .websocket-status.awaiting-auth .connection-indicator {
            background: var(--warning-color);
            box-shadow: 0 0 8px var(--warning-color);
            animation: authWaitPulse 1.5s infinite;
        }

        .websocket-status.connecting .connection-indicator {
            background: var(--cyber-glow);
            animation: connectionBlink 1s infinite;
        }

        .websocket-status.disconnected .connection-indicator {
            background: var(--danger-color);
            animation: connectionError 0.5s infinite alternate;
        }

        /* Enhanced animations for connection states */
        @keyframes authenticatedPulse {
            0%, 100% { 
                transform: scale(1);
                opacity: 1;
            }
            50% { 
                transform: scale(1.3);
                opacity: 0.8;
                box-shadow: 
                    0 0 12px var(--success-color),
                    0 0 24px rgba(16, 185, 129, 0.6);
            }
        }

        @keyframes networkPulse {
            0%, 100% { 
                transform: scale(1);
                opacity: 0.8;
            }
            50% { 
                transform: scale(1.2);
                opacity: 1;
                box-shadow: 
                    0 0 10px rgba(0, 217, 255, 0.8),
                    0 0 20px rgba(0, 217, 255, 0.5);
            }
        }

        @keyframes authWaitPulse {
            0%, 100% { 
                transform: scale(1);
                opacity: 0.7;
            }
            50% { 
                transform: scale(1.1);
                opacity: 1;
                box-shadow: 0 0 10px var(--warning-color);
            }
        }

        @keyframes connectionBlink {
            0%, 50% { 
                opacity: 1;
                transform: scale(1);
            }
            51%, 100% { 
                opacity: 0.3;
                transform: scale(0.8);
            }
        }

        @keyframes connectionError {
            0% { 
                transform: scale(1);
                background: var(--danger-color);
            }
            100% { 
                transform: scale(1.2);
                background: rgba(239, 68, 68, 0.7);
            }
        }

        /* Enhanced login page behavior and authentication feedback */
        .login-page .websocket-status:not(.authenticated):not(.disconnected) {
            opacity: 0.7;
            transform: scale(0.9);
        }

        .login-page .websocket-status.authenticated {
            opacity: 1;
            transform: scale(1);
        }

        /* Authentication state visual feedback on forms */
        .form-panel.authentication-success {
            background: rgba(16, 185, 129, 0.05);
            border: 1px solid rgba(16, 185, 129, 0.2);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.1);
        }

        .form-panel.authentication-error {
            background: rgba(239, 68, 68, 0.05);
            border: 1px solid rgba(239, 68, 68, 0.2);
            animation: authErrorShake 0.5s ease-in-out;
        }

        @keyframes authErrorShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Enhanced input field states for authentication feedback */
        .input-field.auth-success {
            border-color: var(--success-color);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }

        .input-field.auth-error {
            border-color: var(--danger-color);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.2);
            animation: inputErrorPulse 0.3s ease-in-out;
        }

        @keyframes inputErrorPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        /* WebSocket notification improvements */
        .websocket-notification.login-success {
            border-color: var(--success-color);
            background: linear-gradient(135deg, 
                rgba(16, 185, 129, 0.1), 
                rgba(16, 185, 129, 0.05));
        }

        .websocket-notification.login-error {
            border-color: var(--danger-color);
            background: linear-gradient(135deg, 
                rgba(239, 68, 68, 0.1), 
                rgba(239, 68, 68, 0.05));
        }

        /* Status text styling */
        .websocket-status #connection-text {
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-size: 11px;
        }

        @keyframes authenticatedPulse {
            0%, 100% { 
                transform: scale(1);
                opacity: 1;
            }
            50% { 
                transform: scale(1.2);
                opacity: 0.8;
            }
        }

        @keyframes authWaitPulse {
            0%, 100% { 
                transform: scale(1);
                opacity: 0.8;
            }
            50% { 
                transform: scale(1.15);
                opacity: 1;
            }
        }

        @keyframes connectionBlink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }

        @keyframes connectionError {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        /* WebSocket Data Flow Animation */
        .data-flow-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .data-packet {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--cyber-glow);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--cyber-glow);
            opacity: 0;
            animation: dataFlow 3s linear infinite;
        }

        .data-packet.active {
            opacity: 1;
        }

        @keyframes dataFlow {
            0% {
                transform: translateX(0) translateY(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateX(300px) translateY(-50px);
                opacity: 0;
            }
        }

        /* Enhanced Network Visualization */
        .network-nodes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .network-node {
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--cyber-glow);
            border-radius: 50%;
            opacity: 0.6;
            animation: nodeFloat 4s ease-in-out infinite;
        }

        .network-node::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            width: 10px;
            height: 10px;
            border: 1px solid var(--cyber-glow);
            border-radius: 50%;
            opacity: 0.3;
            animation: nodeRipple 3s ease-out infinite;
        }

        .network-node.active {
            animation: nodeActive 2s ease-in-out infinite;
        }

        @keyframes nodeFloat {
            0%, 100% { 
                transform: translateY(0) scale(1);
                opacity: 0.6;
            }
            50% { 
                transform: translateY(-20px) scale(1.1);
                opacity: 0.8;
            }
        }

        @keyframes nodeRipple {
            0% {
                transform: scale(1);
                opacity: 0.3;
            }
            100% {
                transform: scale(3);
                opacity: 0;
            }
        }

        @keyframes nodeActive {
            0%, 100% { 
                transform: scale(1);
                box-shadow: 0 0 8px var(--cyber-glow);
            }
            50% { 
                transform: scale(1.3);
                box-shadow: 0 0 20px var(--cyber-glow);
            }
        }

        /* Real-time Notification Toast */
        .websocket-notification {
            position: fixed;
            top: 80px;
            right: 20px;
            min-width: 300px;
            max-width: 400px;
            padding: 16px 20px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            z-index: 1001;
            transform: translateX(100%);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .websocket-notification.show {
            transform: translateX(0);
        }

        .websocket-notification.success {
            border-color: var(--success-color);
            background: rgba(16, 185, 129, 0.1);
        }

        .websocket-notification.error {
            border-color: var(--danger-color);
            background: rgba(239, 68, 68, 0.1);
        }

        .websocket-notification.warning {
            border-color: var(--warning-color);
            background: rgba(245, 158, 11, 0.1);
        }

        .notification-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .notification-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .notification-body {
            font-size: 13px;
            line-height: 1.4;
            color: var(--text-secondary);
        }

        /* Form Enhancement for WebSocket Activity */
        .form-panel.websocket-active {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(0, 217, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.1);
        }

        .input-field.websocket-active {
            border-color: var(--cyber-glow);
            box-shadow: 0 0 15px rgba(0, 217, 255, 0.2);
        }

        .btn-primary.websocket-processing {
            background: linear-gradient(45deg, var(--cyber-glow), var(--network-purple));
            animation: processingPulse 1.5s ease-in-out infinite;
        }

        @keyframes processingPulse {
            0%, 100% { 
                transform: scale(1);
                opacity: 1;
            }
            50% { 
                transform: scale(1.02);
                opacity: 0.9;
            }
        }

        /* Additional animations for network theme */
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        @keyframes patternMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-200px, -200px); }
        }

        .network-active {
            animation: pulse 2s infinite;
        }

        /* Floating particles animation */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        /* Form panel hover effects */
        .form-panel:hover {
            background: rgba(15, 23, 42, 0.4);
        }

        /* Input field focus enhancements */
        .input-field:focus::placeholder {
            opacity: 0.5;
            transform: translateX(10px);
            transition: all 0.3s ease;
        }

        /* Button loading state */
        .btn-primary.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        .btn-primary.loading::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            margin: auto;
            border: 2px solid transparent;
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        /* Network connection lines */
        .auth-container::after {
            content: '';
            position: absolute;
            top: 20%;
            left: 20%;
            width: 60%;
            height: 60%;
            background: 
                linear-gradient(45deg, transparent 40%, rgba(0, 217, 255, 0.1) 50%, transparent 60%),
                linear-gradient(-45deg, transparent 40%, rgba(139, 92, 246, 0.1) 50%, transparent 60%);
            pointer-events: none;
            z-index: -1;
            opacity: 0.3;
        }

        /* Responsive WebSocket Elements */
        @media (max-width: 768px) {
            .websocket-status {
                top: 8px;
                right: 8px;
                padding: 6px 10px;
                font-size: 10px;
                min-width: auto;
            }
            
            .connection-indicator {
                width: 8px;
                height: 8px;
            }

            .websocket-notification {
                right: 8px;
                left: 8px;
                top: 60px;
                width: auto;
                min-width: unset;
                max-width: unset;
                padding: 12px 16px;
            }
            
            .notification-header {
                font-size: 13px;
            }
            
            .notification-body {
                font-size: 12px;
            }

            .data-flow-container,
            .network-nodes {
                display: none;
            }
        }
        
        @media (max-width: 480px) {
            .websocket-status {
                padding: 5px 8px;
                font-size: 9px;
            }
            
            .connection-indicator {
                width: 6px;
                height: 6px;
            }
            
            .websocket-notification {
                padding: 10px 14px;
            }
        }
        
        /* Touch-friendly enhancements for mobile */
        @media (hover: none) and (pointer: coarse) {
            .btn-primary,
            .btn-secondary,
            .otp-btn {
                min-height: 44px; /* iOS recommended minimum touch target */
            }
            
            .input-field {
                min-height: 44px;
            }
            
            /* Remove hover effects on touch devices */
            .btn-primary:hover,
            .btn-secondary:hover,
            .otp-btn:hover {
                transform: none;
            }
            
            /* Add active states instead */
            .btn-primary:active {
                transform: scale(0.98);
                opacity: 0.9;
            }
            
            .btn-secondary:active {
                transform: scale(0.98);
            }
            
            .otp-btn:active {
                transform: scale(0.98);
            }
        }
        
        /* Landscape orientation optimizations */
        @media (max-width: 768px) and (orientation: landscape) {
            .auth-container {
                margin: 10px auto;
            }
            
            .side-panel {
                height: 120px;
                padding: 15px;
            }
            
            .panel-title {
                font-size: 18px;
                margin-bottom: 8px;
            }
            
            .panel-subtitle {
                font-size: 12px;
                margin-bottom: 15px;
            }
            
            .form-panel {
                padding: 20px;
            }
        }
        
        /* Very small screens - ensure everything fits */
        @media (max-width: 320px) {
            .auth-container {
                border-radius: 10px;
            }
            
            .form-title {
                font-size: 16px;
            }
            
            .form-subtitle {
                font-size: 11px;
            }
            
            .panel-title {
                font-size: 16px;
            }
            
            .input-field {
                font-size: 12px;
                height: 38px;
            }
            
            .btn-primary,
            .btn-secondary {
                font-size: 11px;
                height: 38px;
            }
        }
    </style>
</head>
<body>
    <!-- Network Nodes Background -->
    <div class="network-nodes" id="network-nodes">
        <!-- Dynamic nodes will be generated by JavaScript -->
    </div>

    <!-- Data Flow Container -->
    <div class="data-flow-container" id="data-flow-container">
        <!-- Dynamic data packets will be generated by JavaScript -->
    </div>

    <!-- Back to Landing Page Button -->
    <a href="/" class="back-to-landing" title="Back to Home">
        <i class='bx bx-home'></i>
        <span>Home</span>
    </a>

    <!-- Main Container -->
    <div class="auth-container" id="authContainer">
        <!-- Sign In Panel -->
        <div class="form-panel signin">
            <form action="{{ url_for('user.login') }}" method="POST" id="loginForm">
                <img src="{{ url_for('static', filename='img/Logo.png') }}" alt="RiddleNet Logo" class="logo">
                <h1 class="form-title">Welcome Back</h1>
                <p class="form-subtitle">Connect to your network learning hub</p>
                
                {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
                {% endif %}
                
                <div class="input-group">
                    <input type="email" name="email" id="login-email" placeholder="Email Address" class="input-field" required autocomplete="email">
                </div>
                
                <div class="input-group" style="position: relative;">
                    <input type="password" name="password" id="loginPassword" placeholder="Password" class="input-field" required>
                    <i class='bx bx-show toggle-password' id="toggleLoginPassword" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: rgba(255, 255, 255, 0.5); font-size: 1.3rem; transition: all 0.3s; z-index: 10;" title="Show password"></i>
                </div>
                
                <div id="message" class="message-container"></div>
                
                <div class="otp-section">
                    <input type="text" name="otp" id="otp" placeholder="OTP Code" class="input-field otp-input">
                    <button type="button" id="requestOtp" class="otp-btn">Request OTP</button>
                </div>
                
                <div id="otp-timer" class="otp-timer">
                    OTP expires in: <span id="countdown">10:00</span>
                </div>
                
                <button type="submit" class="btn-primary" id="loginSubmitBtn">
                    <i class='bx bx-log-in'></i>
                    Sign In
                </button>
            </form>
        </div>

        <!-- Sign Up Panel -->
        <div class="form-panel signup">
            <form action="{{ url_for('user.signup') }}" method="POST" id="signupForm">
                <img src="{{ url_for('static', filename='img/Logo.png') }}" alt="RiddleNet Logo" class="logo">
                {% if qr_code_path %}
                <div class="qr-code-container">
                    <img src="{{ url_for('static', filename=qr_code_path) }}" alt="QR Code" class="qr-code">
                </div>
                {% endif %}
                <h1 class="form-title">Join the Network</h1>
                <p class="form-subtitle">Start your networking journey today</p>
                
                <div class="input-group">
                    <input type="text" name="username" placeholder="Username" class="input-field" required autocomplete="off">
                </div>
                
                <div class="input-group">
                    <input type="email" name="email" placeholder="Email" class="input-field" required autocomplete="off">
                </div>
                
                <div class="input-group" style="position: relative;">
                    <input type="password" name="password" id="signupPassword" placeholder="Password" class="input-field" required>
                    <i class='bx bx-show toggle-password' id="toggleSignupPassword" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: rgba(255, 255, 255, 0.5); font-size: 1.3rem; transition: all 0.3s; z-index: 10;" title="Show password"></i>
                </div>
                
                <div id="signup-message" class="message-container"></div>
                
                <button type="submit" class="btn-primary">
                    <i class='bx bx-user-plus'></i>
                    Create Account
                </button>
            </form>
        </div>

        <!-- Side Panel -->
        <div class="side-panel">
            <div class="panel-content">
                <h2 class="panel-title">🌐 RiddleNet</h2>
                <button class="btn-secondary" id="toggleBtn">
                    <i class='bx bx-user-plus'></i>
                    Sign Up
                </button>
            </div>
        </div>
    </div>

    <!-- Audio for click feedback -->
    <audio id="clickSound" src="{{ url_for('static', filename='audio/Start.mp3') }}"></audio>

    {% if message %}
    <script>
        // Display backend messages using notification styling
        document.addEventListener('DOMContentLoaded', function() {
            const messageElement = document.getElementById('message');
            messageElement.className = 'message-container error-message show';
            messageElement.textContent = "{{ message }}";
            
            // Auto-hide after 5 seconds
            setTimeout(() => {
                messageElement.className = 'message-container';
                messageElement.style.display = 'none';
            }, 5000);
        });
    </script>
    {% endif %}

    <!-- Load OTP Script -->
    <script src="{{ url_for('static', filename='js/otp.js') }}"></script>
    
    <!-- Main JavaScript -->
    <script>
        // Sound effect function
        function playClickSound() {
            const audio = document.getElementById('clickSound');
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log('Audio play failed:', e));
            }
        }

        // Add click sound to all buttons
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', playClickSound);
        });

        // Get elements
        const authContainer = document.getElementById('authContainer');
        const toggleBtn = document.getElementById('toggleBtn');
        let isSignupMode = false;

        // Check URL parameters for signup mode
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('signup') === 'true') {
            isSignupMode = true;
            authContainer.classList.add('signup-mode');
            if (toggleBtn) {
                toggleBtn.innerHTML = '<i class="bx bx-log-in"></i> Sign In';
            }
        }

        // Toggle between signin and signup
        if (toggleBtn) {
            toggleBtn.addEventListener('click', (e) => {
                e.preventDefault();
                playClickSound();
                
                isSignupMode = !isSignupMode;
                
                if (isSignupMode) {
                    authContainer.classList.add('signup-mode');
                    toggleBtn.innerHTML = '<i class="bx bx-log-in"></i> Sign In';
                } else {
                    authContainer.classList.remove('signup-mode');
                    toggleBtn.innerHTML = '<i class="bx bx-user-plus"></i> Sign Up';
                }
            });
        }

        // Enhanced signup form submission with WebSocket feedback
        document.querySelector('#signupForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const formData = new FormData(this);
            const messageElement = document.getElementById('signup-message');
            const submitButton = this.querySelector('button[type="submit"]');
            const formElement = this;
            
            // Clear previous authentication states
            if (websocketManager) {
                websocketManager.clearAuthenticationState(formElement);
                websocketManager.activateFormWebSocket(formElement);
            }
            
            // Show loading state with enhanced feedback
            messageElement.className = 'message-container show';
            messageElement.innerHTML = '<span class="loading-spinner"></span>Creating your account...';
            
            // Disable submit button
            submitButton.disabled = true;
            submitButton.style.opacity = '0.7';

            // WebSocket feedback for form processing
            if (websocketManager) {
                websocketManager.showNotification(
                    'Creating Account',
                    'Processing your registration...',
                    'warning'
                );
            }

            fetch("{{ url_for('user.signup') }}", {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'error') {
                    // Enhanced error handling with WebSocket feedback
                    messageElement.className = 'message-container error-message show';
                    messageElement.textContent = data.message;
                    
                    if (websocketManager) {
                        websocketManager.showAuthenticationError(formElement, data.message);
                    }
                    
                    // Clear and focus on the appropriate field
                    if (data.message.includes('Username already exists')) {
                        const usernameField = document.querySelector('input[name="username"]');
                        usernameField.value = '';
                        usernameField.focus();
                        usernameField.classList.add('auth-error');
                    } else if (data.message.includes('Email address already in use')) {
                        const emailField = document.querySelector('input[name="email"]');
                        emailField.value = '';
                        emailField.focus();
                        emailField.classList.add('auth-error');
                    }
                    
                    // Re-enable submit button
                    submitButton.disabled = false;
                    submitButton.style.opacity = '1';
                    
                    // Auto-hide error message after 5 seconds
                    setTimeout(() => {
                        messageElement.className = 'message-container';
                        messageElement.style.display = 'none';
                        if (websocketManager) {
                            websocketManager.clearAuthenticationState(formElement);
                        }
                    }, 5000);
                    
                    return Promise.reject('Registration error');
                }
                
                // Enhanced success handling with WebSocket feedback
                messageElement.className = 'message-container success-message show';
                messageElement.textContent = data.message;
                
                if (websocketManager) {
                    websocketManager.showAuthenticationSuccess(formElement);
                    websocketManager.showNotification(
                        'Account Created',
                        'Welcome to RiddleNet! Redirecting to login...',
                        'success'
                    );
                }
                
                // Reset form
                this.querySelectorAll('input').forEach(input => input.value = '');
                
                // Switch to login form after delay
                setTimeout(() => {
                    authContainer.classList.remove('signup-mode');
                    toggleBtn.innerHTML = '<i class="bx bx-user-plus"></i> Sign Up';
                    isSignupMode = false;
                    
                    // Hide message
                    messageElement.className = 'message-container';
                    messageElement.style.display = 'none';
                    
                    // Re-enable button
                    submitButton.disabled = false;
                    submitButton.style.opacity = '1';
                }, 2000);
            })
            .catch(error => {
                if (error === 'Registration error') return;
                
                // Show general error
                messageElement.className = 'message-container error-message show';
                messageElement.textContent = 'An error occurred. Please try again.';
                
                console.error('Error:', error);
                
                // Re-enable submit button
                submitButton.disabled = false;
                submitButton.style.opacity = '1';
                
                // Auto-hide error message
                setTimeout(() => {
                    messageElement.className = 'message-container';
                    messageElement.style.display = 'none';
                }, 5000);
            });
        });

        // Add entrance animation
        document.addEventListener('DOMContentLoaded', function() {
            authContainer.style.opacity = '0';
            authContainer.style.transform = 'translateY(30px)';
            
            setTimeout(() => {
                authContainer.style.transition = 'all 0.6s ease-out';
                authContainer.style.opacity = '1';
                authContainer.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>

    <!-- Enhanced WebSocket Client for Real-time Notifications -->
    <script src="{{ url_for('static', filename='js/socket-client.js') }}"></script>
    <script>
        // Enhanced WebSocket Management and Visual Feedback System
        class WebSocketVisualManager {
            constructor() {
                this.statusElement = null; // Removed - no longer needed on login page
                this.connectionText = null;
                this.networkNodes = document.getElementById('network-nodes');
                this.dataFlowContainer = document.getElementById('data-flow-container');
                
                this.isConnected = false;
                this.isAuthenticated = false;
                this.nodeCount = 8;
                this.dataPacketInterval = null;
                
                this.init();
            }

            init() {
                this.createNetworkNodes();
                this.checkAuthenticationStatus();
                this.setupWebSocketHandlers();
            }

            checkAuthenticationStatus() {
                // Check if user is already logged in
                const isLoggedIn = document.body.classList.contains('authenticated') || 
                                  document.querySelector('.dashboard-nav') !== null ||
                                  window.location.pathname.includes('/dashboard') ||
                                  window.location.pathname.includes('/profile') ||
                                  window.location.pathname.includes('/classes') ||
                                  window.location.pathname.includes('/troubleshoot');
                
                if (isLoggedIn) {
                    this.isAuthenticated = true;
                    this.updateConnectionStatus('connecting');
                } else {
                    this.isAuthenticated = false;
                }
            }

            showStatusIndicator() {
                // No longer needed - status indicator removed from login page
            }

            hideStatusIndicator() {
                // No longer needed - status indicator removed from login page
            }

            createNetworkNodes() {
                for (let i = 0; i < this.nodeCount; i++) {
                    const node = document.createElement('div');
                    node.className = 'network-node';
                    
                    // Random positioning
                    const x = Math.random() * 80 + 10; // 10-90%
                    const y = Math.random() * 80 + 10; // 10-90%
                    
                    node.style.left = `${x}%`;
                    node.style.top = `${y}%`;
                    node.style.animationDelay = `${Math.random() * 4}s`;
                    
                    this.networkNodes.appendChild(node);
                }
            }

            updateConnectionStatus(status) {
                // Simplified - just log connection status
                console.log(`WebSocket connection status: ${status}`);
                
                // Update connection state with improved messaging
                switch (status) {
                    case 'authenticated':
                        this.isConnected = true;
                        this.isAuthenticated = true;
                        this.activateNetworkNodes();
                        this.startDataFlow();
                        break;
                    case 'network-connected':
                        this.isConnected = true;
                        this.isAuthenticated = false;
                        this.deactivateNetworkNodes();
                        this.stopDataFlow();
                        break;
                    case 'awaiting-auth':
                        this.isConnected = true;
                        this.isAuthenticated = false;
                        this.deactivateNetworkNodes();
                        this.stopDataFlow();
                        break;
                    case 'connecting':
                        this.isConnected = false;
                        this.isAuthenticated = false;
                        this.deactivateNetworkNodes();
                        this.stopDataFlow();
                        break;
                    case 'disconnected':
                        this.isConnected = false;
                        this.isAuthenticated = false;
                        this.deactivateNetworkNodes();
                        this.stopDataFlow();
                        break;
                }
            }

            activateNetworkNodes() {
                const nodes = this.networkNodes.querySelectorAll('.network-node');
                nodes.forEach((node, index) => {
                    setTimeout(() => {
                        node.classList.add('active');
                    }, index * 200);
                });
            }

            deactivateNetworkNodes() {
                const nodes = this.networkNodes.querySelectorAll('.network-node');
                nodes.forEach(node => {
                    node.classList.remove('active');
                });
            }

            startDataFlow() {
                if (this.dataPacketInterval) return;
                
                this.dataPacketInterval = setInterval(() => {
                    this.createDataPacket();
                }, 800);
            }

            stopDataFlow() {
                if (this.dataPacketInterval) {
                    clearInterval(this.dataPacketInterval);
                    this.dataPacketInterval = null;
                }
            }

            createDataPacket() {
                const packet = document.createElement('div');
                packet.className = 'data-packet active';
                
                // Random starting position
                packet.style.left = `${Math.random() * 20}%`;
                packet.style.top = `${Math.random() * 80 + 10}%`;
                
                this.dataFlowContainer.appendChild(packet);
                
                // Remove packet after animation
                setTimeout(() => {
                    if (packet.parentNode) {
                        packet.parentNode.removeChild(packet);
                    }
                }, 3000);
            }

            showNotification(title, message, type = 'success') {
                // Simplified - just log to console since we removed the notification UI
                console.log(`[${type.toUpperCase()}] ${title}: ${message}`);
                
                // Show message in the form's message container if available
                const messageElement = document.getElementById('message') || document.getElementById('signup-message');
                if (messageElement) {
                    messageElement.textContent = message;
                    messageElement.className = `message-container ${type === 'error' ? 'error-message' : type === 'warning' ? 'warning-message' : 'success-message'} show`;
                    
                    // Auto-hide after 4 seconds
                    setTimeout(() => {
                        messageElement.className = 'message-container';
                        messageElement.style.display = 'none';
                    }, 4000);
                }
            }

            hideNotification() {
                // No longer needed - notifications removed
                console.log('Notification hidden');
            }

            activateFormWebSocket(formElement) {
                formElement.classList.add('websocket-active');
                
                const inputs = formElement.querySelectorAll('.input-field');
                inputs.forEach(input => {
                    input.classList.add('websocket-active');
                });
            }

            deactivateFormWebSocket(formElement) {
                formElement.classList.remove('websocket-active');
                
                const inputs = formElement.querySelectorAll('.input-field');
                inputs.forEach(input => {
                    input.classList.remove('websocket-active');
                });
            }

            activateFormWebSocket(formElement) {
                if (formElement) {
                    formElement.classList.add('websocket-active');
                    const inputs = formElement.querySelectorAll('.input-field');
                    inputs.forEach(input => {
                        input.classList.add('websocket-active');
                    });
                }
            }

            deactivateFormWebSocket(formElement) {
                if (formElement) {
                    formElement.classList.remove('websocket-active');
                    const inputs = formElement.querySelectorAll('.input-field');
                    inputs.forEach(input => {
                        input.classList.remove('websocket-active');
                    });
                }
            }

            // Enhanced authentication feedback methods
            showAuthenticationSuccess(formElement) {
                if (formElement) {
                    formElement.classList.remove('authentication-error');
                    formElement.classList.add('authentication-success');
                    
                    const inputs = formElement.querySelectorAll('.input-field');
                    inputs.forEach(input => {
                        input.classList.remove('auth-error');
                        input.classList.add('auth-success');
                    });
                }
            }

            showAuthenticationError(formElement, errorMessage = null) {
                if (formElement) {
                    formElement.classList.remove('authentication-success');
                    formElement.classList.add('authentication-error');
                    
                    const inputs = formElement.querySelectorAll('.input-field');
                    inputs.forEach(input => {
                        input.classList.remove('auth-success');
                        input.classList.add('auth-error');
                    });
                    
                    if (errorMessage) {
                        this.showNotification(
                            'Authentication Failed',
                            errorMessage,
                            'error'
                        );
                    }
                }
            }

            clearAuthenticationState(formElement) {
                if (formElement) {
                    formElement.classList.remove('authentication-success', 'authentication-error');
                    
                    const inputs = formElement.querySelectorAll('.input-field');
                    inputs.forEach(input => {
                        input.classList.remove('auth-success', 'auth-error', 'websocket-active');
                    });
                }
            }

            // Method to handle login form submission
            handleLoginAttempt() {
                this.showStatusIndicator();
                this.updateConnectionStatus('connecting');
                this.showNotification(
                    'Authenticating',
                    'Verifying your credentials...',
                    'warning'
                );
            }

            // Method to handle successful login
            handleLoginSuccess(username) {
                this.isAuthenticated = true;
                this.updateConnectionStatus('authenticated');
                this.showNotification(
                    'Login Successful',
                    `Welcome back, ${username}!`,
                    'success'
                );
            }

            // Method to handle login failure
            handleLoginFailure(reason) {
                this.updateConnectionStatus('awaiting-auth');
                this.showNotification(
                    'Login Failed',
                    reason || 'Please check your credentials and try again',
                    'error'
                );
            }

            setupWebSocketHandlers() {
                // Wait for socket client to be available
                const checkSocketClient = () => {
                    if (window.socketClient) {
                        this.bindSocketEvents();
                        
                        // Simplified authentication-aware status logic
                        if (this.isAuthenticated) {
                            this.updateConnectionStatus('authenticated');
                            console.log('WebSocket: Connected & Authenticated');
                        } else {
                            this.updateConnectionStatus('awaiting-auth');
                            console.log('WebSocket: Awaiting authentication');
                        }
                    } else {
                        setTimeout(checkSocketClient, 500);
                    }
                };
                
                setTimeout(checkSocketClient, 1000);
            }

            bindSocketEvents() {
                const socket = window.socketClient;
                
                // Connection events
                socket.on('connect', () => {
                    if (this.isAuthenticated) {
                        this.updateConnectionStatus('authenticated');
                        this.showNotification(
                            'Connected & Authenticated',
                            'Real-time features are available',
                            'success'
                        );
                    } else {
                        this.updateConnectionStatus('awaiting-auth');
                        // Only show notification if not on login page
                        if (window.location.pathname !== '/user/login' && window.location.pathname !== '/') {
                            this.showNotification(
                                'Network Connected',
                                'Please log in to access features',
                                'warning'
                            );
                        }
                    }
                });

                socket.on('disconnect', () => {
                    this.updateConnectionStatus('disconnected');
                    this.showNotification(
                        'Connection Lost',
                        'Attempting to reconnect...',
                        'error'
                    );
                });

                socket.on('reconnect', () => {
                    if (this.isAuthenticated) {
                        this.updateConnectionStatus('authenticated');
                        this.showNotification(
                            'Reconnected',
                            'Real-time features restored',
                            'success'
                        );
                    } else {
                        this.updateConnectionStatus('awaiting-auth');
                        this.showNotification(
                            'Reconnected',
                            'Please log in to access features',
                            'warning'
                        );
                    }
                });

                // Authentication events
                socket.on('login_success', (data) => {
                    this.isAuthenticated = true;
                    this.updateConnectionStatus('authenticated');
                    this.showNotification(
                        'Login Successful',
                        `Welcome back, ${data.username || 'User'}!`,
                        'success'
                    );
                });

                socket.on('logout_complete', (data) => {
                    this.isAuthenticated = false;
                    this.updateConnectionStatus('awaiting-auth');
                    this.showNotification(
                        'Logout Complete',
                        'You have been safely signed out',
                        'success'
                    );
                    
                    // Hide status indicator after logout
                    setTimeout(() => {
                        this.hideStatusIndicator();
                    }, 3000);
                });

                // OTP events with enhanced feedback
                socket.on('otp_request_received', (data) => {
                    this.showNotification(
                        'OTP Request Received',
                        'Processing your OTP request...',
                        'warning'
                    );
                    
                    const otpButton = document.getElementById('requestOtp');
                    if (otpButton) {
                        this.setButtonProcessing(otpButton, true);
                    }
                });

                socket.on('otp_email_sent', (data) => {
                    this.showNotification(
                        'OTP Sent Successfully',
                        'Please check your email and enter the code below',
                        'success'
                    );
                    
                    const otpButton = document.getElementById('requestOtp');
                    const otpInput = document.getElementById('otp');
                    
                    if (otpButton) {
                        this.setButtonProcessing(otpButton, false);
                    }
                    
                    if (otpInput) {
                        otpInput.focus();
                        otpInput.classList.add('websocket-active');
                    }
                    
                    // Show timer
                    const timer = document.getElementById('otp-timer');
                    if (timer) {
                        timer.style.display = 'block';
                    }
                });

                socket.on('otp_email_failed', (data) => {
                    this.showNotification(
                        'OTP Send Failed',
                        data.message || 'Unable to send OTP. Please try again.',
                        'error'
                    );
                    
                    const otpButton = document.getElementById('requestOtp');
                    if (otpButton) {
                        this.setButtonProcessing(otpButton, false);
                    }
                });

                // User activity events
                socket.on('user_activity', (data) => {
                    if (data.activity_type === 'form_interaction') {
                        this.createDataPacket();
                    }
                });

                // System events
                socket.on('system_notification', (data) => {
                    this.showNotification(
                        data.title || 'System Notification',
                        data.message || 'System update received',
                        data.type || 'info'
                    );
                });
            }
        }

        // Initialize WebSocket Visual Manager
        let websocketManager;
        
        // Initialize WebSocket event handlers for login/logout notifications
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize WebSocket visual manager
            websocketManager = new WebSocketVisualManager();
            
            // Enhanced form interaction tracking with WebSocket feedback
            const forms = document.querySelectorAll('form');
            forms.forEach(form => {
                form.addEventListener('focus', (e) => {
                    if (websocketManager && websocketManager.isConnected) {
                        websocketManager.activateFormWebSocket(form);
                        websocketManager.createDataPacket();
                    }
                }, true);
                
                form.addEventListener('blur', (e) => {
                    if (websocketManager) {
                        setTimeout(() => {
                            if (!form.contains(document.activeElement)) {
                                websocketManager.deactivateFormWebSocket(form);
                            }
                        }, 100);
                    }
                }, true);
            });
            
            // Enhanced login form handler with WebSocket feedback
            const loginForm = document.getElementById('loginForm');
            if (loginForm) {
                loginForm.addEventListener('submit', function(event) {
                    const submitButton = this.querySelector('#loginSubmitBtn');
                    const messageElement = document.getElementById('message');
                    
                    // Clear previous authentication states
                    if (websocketManager) {
                        websocketManager.clearAuthenticationState(this);
                        websocketManager.activateFormWebSocket(this);
                        websocketManager.updateConnectionStatus('connecting');
                        websocketManager.showNotification(
                            'Authenticating',
                            'Verifying your credentials...',
                            'warning'
                        );
                    }
                    
                    // Add visual feedback
                    if (submitButton) {
                        submitButton.classList.add('websocket-processing');
                    }
                    
                    // Let the normal form submission proceed
                    // WebSocket events will handle the response
                });
            }
        });
        
        // Initialize WebSocket visual manager and form handlers
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize WebSocket visual manager
