{% extends 'user/base.html' %} 
{% block head %}
<title>My Classes | RiddleNet</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
<script src="{{ url_for('static', filename='js/user/dashboard.js') }}"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/user/dashboard.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/user/class-details.css') }}">
<link rel="icon" href="{{ static_url('img/Logo.png') }}" />

<style>
  @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap");
  @import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap");

  :root {
    --cyber-glow: #00D9FF;
    --neon-green: #39FF14;
    --network-purple: #8B5CF6;
    --dark-navy: #1a237e;
    --deep-purple: #2a1b3d;
    --dark-bg: rgba(26, 35, 126, 0.85);
    --glass-bg: rgba(139, 92, 246, 0.08);
    --glass-border: rgba(0, 217, 255, 0.15);
    --gradient-primary: linear-gradient(135deg, var(--cyber-glow), var(--network-purple));
    --gradient-secondary: linear-gradient(135deg, var(--neon-green), var(--cyber-glow));
    --text-primary: #111;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
  }

  body {
    background: url("{{ url_for('static', filename='img/Bg.jpg') }}") no-repeat center center fixed;
    background-size: cover;
    color: #fff;
    overflow-x: hidden;
    min-height: 100vh;
    transition: 0.3s ease;
    position: relative;
    font-family: 'Orbitron', 'Poppins', sans-serif;
  }
  
  .video-background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    object-fit: cover;
  }

  /* Classes specific styles */
  .classes-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px;
  }

  .classes-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 48px;
  }

  .section-title {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .section-title h2 {
    font-size: 2rem;
    font-weight: 700;
    background: var(--gradient-primary);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 0;
  }
  
  .section-icon {
    font-size: 2rem;
    color: var(--cyber-glow);
    filter: drop-shadow(0 0 8px var(--cyber-glow));
  }

  .back-button {
    padding: 12px 24px;
    background: transparent;
    border: 1px solid var(--cyber-glow);
    border-radius: 8px;
    color: var(--cyber-glow);
    font-size: 0.9rem;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    transition: all 0.3s ease;
  }

  .back-button:hover {
    background: rgba(0, 217, 255, 0.1);
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(0, 217, 255, 0.2);
  }

  .section-card, .modern-card {
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 32px;
    margin-bottom: 32px;
    box-shadow: 0 8px 32px rgba(26, 35, 126, 0.4);
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .section-card::before, .modern-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--gradient-primary);
    opacity: 0.8;
  }
  
  .section-card:hover, .modern-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(0, 217, 255, 0.2);
    border-color: var(--cyber-glow);
  }

  .section-title {
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--cyber-glow);
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .section-title i {
    font-size: 1.3rem;
    filter: drop-shadow(0 0 8px var(--cyber-glow));
  }

  /* Join Class Form */
  .join-class-form {
    display: grid;
    gap: 20px;
  }
  
  .join-class-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  
  .join-class-header i {
    font-size: 1.5rem;
    color: var(--cyber-glow);
    filter: drop-shadow(0 0 8px var(--cyber-glow));
  }
  
  .join-class-header h3 {
    font-size: 1.3rem;
    font-weight: 600;
    color: var(--cyber-glow);
    margin: 0;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .form-label {
    font-weight: 500;
    color: rgba(255, 255, 255, 0.9);
    font-size: 0.95rem;
  }

  .form-input {
    padding: 16px 20px;
    background: rgba(0, 0, 0, 0.3);
    border: 2px solid var(--glass-border);
    border-radius: 12px;
    color: white;
    font-size: 1.1rem;
    transition: all 0.3s ease;
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 2px;
    text-align: center;
  }

  .form-input:focus {
    outline: none;
    border-color: var(--cyber-glow);
    box-shadow: 0 0 15px rgba(0, 217, 255, 0.3);
    background: rgba(0, 0, 0, 0.4);
  }

  .form-input::placeholder {
    color: rgba(255, 255, 255, 0.5);
    text-transform: none;
    letter-spacing: normal;
  }

  .join-button {
    padding: 16px 24px;
    background: var(--gradient-primary);
    color: var(--text-primary);
    border: none;
    border-radius: 12px;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .join-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0, 217, 255, 0.4);
  }

  .join-button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }
  
  .action-button {
    background: var(--gradient-primary);
    color: #111;
    border: none;
    border-radius: 10px;
    padding: 12px 24px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    text-align: center;
  }
  
  .action-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 16px rgba(0, 217, 255, 0.3);
  }

  /* Class Cards Grid */
  .classes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 24px;
    margin-top: 32px;
  }

  .class-card {
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    overflow: hidden;
    transition: all 0.3s ease;
    position: relative;
    animation: fadeIn 0.6s ease forwards;
    opacity: 0;
  }

  .class-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--gradient-primary);
    opacity: 0.8;
  }

  .class-card:hover {
    transform: translateY(-4px) scale(1.02);
    border-color: var(--cyber-glow);
    box-shadow: 0 12px 40px rgba(0, 217, 255, 0.2);
  }
  
  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .class-header {
    padding: 24px;
    background: rgba(0, 0, 0, 0.3);
    border-bottom: 1px solid var(--glass-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  
  .class-info {
    display: flex;
    flex-direction: column;
  }

  .class-name {
    font-size: 1.3rem;
    font-weight: 600;
    color: var(--cyber-glow);
    margin: 0 0 8px 0;
    background: var(--gradient-primary);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .class-section {
    color: rgba(255, 255, 255, 0.7);
    font-size: 0.9rem;
  }
  
  .class-avatar {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 2px solid var(--cyber-glow);
    box-shadow: 0 0 15px rgba(0, 217, 255, 0.4);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .class-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .class-body {
    padding: 24px;
  }

  .class-description {
    color: rgba(255, 255, 255, 0.8);
    line-height: 1.6;
    margin-bottom: 20px;
  }

  .class-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: rgba(255, 255, 255, 0.6);
    font-size: 0.85rem;
    margin-bottom: 20px;
  }

  .class-actions {
    display: flex;
    gap: 12px;
  }

  .btn {
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
    border: none;
    text-decoration: none;
    text-align: center;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .btn-primary {
    background: var(--gradient-primary);
    color: var(--text-primary);
  }

  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 15px rgba(0, 217, 255, 0.3);
  }

  .btn-outline {
    background: transparent;
    color: var(--cyber-glow);
    border: 1px solid var(--cyber-glow);
  }

  .btn-outline:hover {
    background: rgba(0, 217, 255, 0.1);
  }

  /* Alerts */
  .alert {
    padding: 16px 20px;
    border-radius: 12px;
    margin-bottom: 24px;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .alert-success {
    background: rgba(46, 204, 113, 0.1);
    border: 1px solid rgba(46, 204, 113, 0.3);
    color: #2ecc71;
  }

  .alert-error {
    background: rgba(231, 76, 60, 0.1);
    border: 1px solid rgba(231, 76, 60, 0.3);
    color: #e74c3c;
  }

  .alert i {
    font-size: 1.2rem;
  }

  /* Loading and Empty States */
  .loading-spinner {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px;
  }

  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid rgba(0, 217, 255, 0.3);
    border-radius: 50%;
    border-top-color: var(--cyber-glow);
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: rgba(255, 255, 255, 0.6);
  }

  .empty-state i {
    font-size: 4rem;
    color: var(--cyber-glow);
    margin-bottom: 24px;
    filter: drop-shadow(0 0 15px var(--cyber-glow));
  }

  .empty-state h3 {
    font-size: 1.5rem;
    color: rgba(255, 255, 255, 0.8);
    margin-bottom: 12px;
  }

  .empty-state p {
    font-size: 1rem;
    color: rgba(255, 255, 255, 0.5);
  }

  /* Cyber-themed animations */
  @keyframes dataFlow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
  }

  .data-flow {
      animation: dataFlow 2s ease-in-out infinite;
  }
  
  /* Glow effects */
  .glow-effect {
    position: relative;
  }
  
  .glow-effect::after {
    content: '';
    position: absolute;
    top: -5px;
    left: -5px;
    right: -5px;
    bottom: -5px;
    z-index: -1;
    background: var(--gradient-primary);
    filter: blur(15px);
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  
  .glow-effect:hover::after {
    opacity: 0.4;
  }

  /* Responsive design */
  @media (max-width: 768px) {
    .classes-container {
      padding: 16px;
    }

    .section-title h2 {
      font-size: 1.6rem;
    }

    .modern-card, .section-card {
      padding: 24px 20px;
    }

    .classes-grid {
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .class-header,
    .class-body {
      padding: 20px;
    }

    .class-actions {
      flex-direction: column;
    }

    .back-link {
      top: 16px;
      left: 16px;
      width: 45px;
      height: 45px;
    }
  }

  @media (max-width: 480px) {
    .classes-header h1 {
      font-size: 1.6rem;
    }

    .section-card {
      padding: 20px 16px;
    }

    .class-header,
    .class-body {
      padding: 16px;
    }
  }
</style>
{% endblock %}

{% block content %}
<video class="video-background" autoplay muted loop playsinline>
    <source src="{{ url_for('static', filename='video/RiddleNet.mp4') }}" type="video/mp4">
</video>

<div class="classes-container">
  <!-- Header Section with Back Button -->
  <div class="modern-card">
    <div class="classes-header">
      <div class="section-title">
        <i class="fas fa-graduation-cap section-icon"></i>
        <h2>My Classes</h2>
      </div>
      <a href="{{ url_for('user.dashboard') }}" class="action-button">
        <i class="fas fa-arrow-left"></i>
        Back to Dashboard
      </a>
    </div>
  </div>

  <!-- Join Class Section -->
  <div class="modern-card">
    <div class="join-class-header">
      <i class="fas fa-plus-circle"></i>
      <h3>Join a Class</h3>
    </div>
    
    <div id="error-alert" class="alert alert-error" style="display: none;">
      <i class="fas fa-exclamation-triangle"></i>
      <span id="error-message"></span>
    </div>
    
    <div id="success-alert" class="alert alert-success" style="display: none;">
      <i class="fas fa-check-circle"></i>
      <span id="success-message"></span>
    </div>
    
    <form id="join-class-form" class="join-class-form">
      <div class="form-group">
        <label for="class-code" class="form-label">
          <i class="fas fa-key" style="color: var(--cyber-glow); margin-right: 8px;"></i>
          Class Code
        </label>
        <input type="text" 
               id="class-code" 
               class="form-input" 
               maxlength="6" 
               placeholder="Enter 6-character code" 
               required>
        <small style="color: rgba(255, 255, 255, 0.6); margin-top: 8px; display: flex; align-items: center; gap: 8px;">
          <i class="fas fa-info-circle"></i>
          Ask your instructor for the class code
        </small>
      </div>
      
      <button type="submit" class="join-button glow-effect" id="join-button">
        <i class="fas fa-sign-in-alt"></i>
        Join Class
      </button>
    </form>
  </div>

  <!-- Enrolled Classes Section -->
  <div class="modern-card">
    <div class="join-class-header">
      <i class="fas fa-chalkboard"></i>
      <h3>Enrolled Classes</h3>
    </div>
    
    <div id="classes-container">
      <div class="loading-spinner">
        <div class="spinner"></div>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    loadEnrolledClasses();
    setupJoinClassForm();
    
    // Add fade-in animation
    const cards = document.querySelectorAll('.modern-card');
    cards.forEach((card, index) => {
        card.style.opacity = '0';
        card.style.transform = 'translateY(20px)';
        setTimeout(() => {
            card.style.transition = 'all 0.6s ease';
            card.style.opacity = '1';
            card.style.transform = 'translateY(0)';
        }, index * 200);
    });
    
    // Add glow effect to buttons
    const buttons = document.querySelectorAll('.action-button, .join-button');
    buttons.forEach(button => {
        button.classList.add('glow-effect');
    });
});

function setupJoinClassForm() {
    const form = document.getElementById('join-class-form');
    const classCodeInput = document.getElementById('class-code');
    const joinButton = document.getElementById('join-button');
    
    // Format class code input
    classCodeInput.addEventListener('input', function() {
        this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    });
    
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const classCode = classCodeInput.value.trim();
        if (!classCode || classCode.length !== 6) {
            showAlert('error', 'Please enter a valid 6-character class code');
            return;
        }
        
        joinClass(classCode);
    });
}

function joinClass(classCode) {
    const joinButton = document.getElementById('join-button');
    const originalText = joinButton.innerHTML;
    
    // Show loading state
    joinButton.disabled = true;
    joinButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Joining...';
    
    fetch('/api/join-class', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({ code: classCode })
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 'success') {
            showAlert('success', data.message);
            document.getElementById('class-code').value = '';
            loadEnrolledClasses(); // Refresh the classes list
        } else {
            showAlert('error', data.message);
        }
    })
    .catch(error => {
        console.error('Error:', error);
        showAlert('error', 'Failed to join class. Please try again.');
    })
    .finally(() => {
        joinButton.disabled = false;
        joinButton.innerHTML = originalText;
    });
}

function loadEnrolledClasses() {
    const container = document.getElementById('classes-container');
    
    fetch('/api/classes')
    .then(response => response.json())
    .then(data => {
        if (data.status === 'success') {
            renderClasses(data.classes);
        } else {
            renderEmptyState();
        }
    })
    .catch(error => {
        console.error('Error loading classes:', error);
        renderEmptyState();
    });
}

function renderClasses(classes) {
    const container = document.getElementById('classes-container');
    
    if (!classes || classes.length === 0) {
        renderEmptyState();
        return;
    }
    
    const html = `
        <div class="classes-grid">
            ${classes.map((classItem, index) => `
                <div class="class-card" style="animation-delay: ${index * 0.1}s">
                    <div class="class-header">
                        <div class="class-info">
                            <h3 class="class-name">${classItem.name}</h3>
                            <div class="class-section">Section: ${classItem.section || 'N/A'}</div>
                        </div>
                        <div class="class-avatar">
                            <img src="${classItem.avatar_url || '/static/img/default_avatar.png'}" alt="Class Avatar" 
                                 onerror="this.src='/static/img/default_avatar.png'">
                        </div>
                    </div>
                    <div class="class-body">
                        <p class="class-description">
                            ${classItem.description || 'No description available'}
                        </p>
                        <div class="class-meta">
                            <span><i class="fas fa-user"></i> Instructor: ${classItem.instructor || 'N/A'}</span>
                            <span><i class="fas fa-users"></i> Students: ${classItem.student_count || 0}</span>
                        </div>
                        <div class="class-actions">
                            <a href="/user/class/${classItem.id}" class="action-button">
                                <i class="fas fa-external-link-alt"></i>
                                Enter Class
                            </a>
                            <button class="btn btn-outline" onclick="viewClassInfo(${classItem.id})">
                                <i class="fas fa-info-circle"></i>
                                Details
                            </button>
                        </div>
                    </div>
                </div>
            `).join('')}
        </div>
    `;
    
    container.innerHTML = html;
}

function renderEmptyState() {
    const container = document.getElementById('classes-container');
    container.innerHTML = `
        <div class="empty-state">
            <i class="fas fa-graduation-cap data-flow"></i>
            <h3>No Classes Enrolled</h3>
            <p>Join a class using the class code provided by your instructor</p>
            <div class="action-button" onclick="document.getElementById('class-code').focus()" style="margin-top: 20px; display: inline-flex;">
                <i class="fas fa-plus-circle"></i>
                Join a Class Now
            </div>
        </div>
    `;
}

function viewClassInfo(classId) {
    // Implement class info modal or redirect
    console.log('Viewing info for class:', classId);
}

function showAlert(type, message) {
    const errorAlert = document.getElementById('error-alert');
    const successAlert = document.getElementById('success-alert');
    
    // Hide both alerts first
    errorAlert.style.display = 'none';
    successAlert.style.display = 'none';
    
    if (type === 'error') {
        document.getElementById('error-message').textContent = message;
        errorAlert.style.display = 'flex';
    } else if (type === 'success') {
        document.getElementById('success-message').textContent = message;
        successAlert.style.display = 'flex';
    }
    
    // Auto-hide after 5 seconds
    setTimeout(() => {
        errorAlert.style.display = 'none';
        successAlert.style.display = 'none';
    }, 5000);
}
</script>
{% endblock %}
