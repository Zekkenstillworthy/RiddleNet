{% extends "user/base.html" %}

{% block title %}{{ page_title }} - RiddleNet{% endblock %}

{% block extra_css %}
<style>
    /* Cyber-themed notification center styles */
    .notification-center {
        background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 50%, #16213e 100%);
        min-height: 100vh;
        padding: 20px;
        color: #00ffff;
        font-family: 'Orbitron', monospace;
    }

    .notification-header {
        background: rgba(0, 255, 255, 0.1);
        border: 1px solid #00ffff;
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 30px;
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
    }

    .notification-header h1 {
        color: #00ffff;
        text-shadow: 0 0 10px #00ffff;
        margin: 0;
        font-size: 2rem;
    }

    .stats-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-top: 20px;
    }

    .stat-card {
        background: rgba(0, 255, 255, 0.05);
        border: 1px solid #00ffff;
        border-radius: 8px;
        padding: 15px;
        text-align: center;
        transition: all 0.3s ease;
    }

    .stat-card:hover {
        background: rgba(0, 255, 255, 0.1);
        box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
    }

    .stat-number {
        font-size: 2rem;
        font-weight: bold;
        color: #00ff00;
        text-shadow: 0 0 5px #00ff00;
    }

    .stat-label {
        color: #ffffff;
        margin-top: 5px;
    }

    .controls-section {
        background: rgba(0, 255, 255, 0.05);
        border: 1px solid #00ffff;
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 30px;
    }

    .control-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 20px;
    }

    .cyber-btn {
        background: linear-gradient(45deg, #0f3460, #16537e);
        border: 1px solid #00ffff;
        color: #00ffff;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-block;
        font-family: 'Orbitron', monospace;
    }

    .cyber-btn:hover {
        background: linear-gradient(45deg, #16537e, #0f3460);
        box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        color: #ffffff;
        text-decoration: none;
    }

    .cyber-btn.danger {
        border-color: #ff3366;
        color: #ff3366;
    }

    .cyber-btn.danger:hover {
        background: linear-gradient(45deg, #ff3366, #cc1a4d);
        color: #ffffff;
    }

    .filter-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        align-items: center;
    }

    .filter-group {
        display: flex;
        flex-direction: column;
        gap: 5px;
    }

    .filter-group label {
        color: #00ffff;
        font-size: 0.9rem;
    }

    .cyber-select, .cyber-input {
        background: rgba(0, 0, 0, 0.7);
        border: 1px solid #00ffff;
        color: #00ffff;
        padding: 8px 12px;
        border-radius: 4px;
        font-family: 'Orbitron', monospace;
    }

    .cyber-select:focus, .cyber-input:focus {
        outline: none;
        box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
    }

    .notifications-container {
        background: rgba(0, 255, 255, 0.05);
        border: 1px solid #00ffff;
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 30px;
    }

    .notification-item {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid #333;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 15px;
        transition: all 0.3s ease;
        cursor: pointer;
    }

    .notification-item:hover {
        border-color: #00ffff;
        box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
    }

    .notification-item.unread {
        border-left: 4px solid #00ff00;
        background: rgba(0, 255, 0, 0.05);
    }

    .notification-item.read {
        opacity: 0.7;
    }

    .notification-header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
    }

    .notification-title {
        color: #00ffff;
        font-weight: bold;
        font-size: 1.1rem;
    }

    .notification-type {
        background: #0f3460;
        color: #00ffff;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 0.8rem;
        border: 1px solid #00ffff;
    }

    .notification-message {
        color: #ffffff;
        margin-bottom: 10px;
        line-height: 1.4;
    }

    .notification-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.9rem;
        color: #cccccc;
    }

    .notification-actions {
        display: flex;
        gap: 10px;
    }

    .action-btn {
        background: none;
        border: 1px solid #00ffff;
        color: #00ffff;
        padding: 5px 10px;
        border-radius: 3px;
        cursor: pointer;
        font-size: 0.8rem;
        transition: all 0.3s ease;
    }

    .action-btn:hover {
        background: #00ffff;
        color: #000000;
    }

    .action-btn.delete {
        border-color: #ff3366;
        color: #ff3366;
    }

    .action-btn.delete:hover {
        background: #ff3366;
        color: #ffffff;
    }

    .pagination {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 20px;
    }

    .pagination button {
        background: rgba(0, 255, 255, 0.1);
        border: 1px solid #00ffff;
        color: #00ffff;
        padding: 8px 15px;
        border-radius: 5px;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .pagination button:hover {
        background: rgba(0, 255, 255, 0.2);
    }

    .pagination button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .pagination button.active {
        background: #00ffff;
        color: #000000;
    }

    .preferences-section {
        background: rgba(0, 255, 255, 0.05);
        border: 1px solid #00ffff;
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 30px;
    }

    .preferences-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        margin-top: 15px;
    }

    .preference-group {
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid #333;
        border-radius: 8px;
        padding: 15px;
    }

    .preference-group h4 {
        color: #00ffff;
        margin: 0 0 15px 0;
        border-bottom: 1px solid #00ffff;
        padding-bottom: 10px;
    }

    .preference-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
    }

    .preference-item label {
        color: #ffffff;
        flex: 1;
    }

    .cyber-checkbox {
        appearance: none;
        width: 20px;
        height: 20px;
        border: 2px solid #00ffff;
        border-radius: 3px;
        background: transparent;
        cursor: pointer;
        position: relative;
    }

    .cyber-checkbox:checked {
        background: #00ffff;
    }

    .cyber-checkbox:checked::after {
        content: '✓';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #000000;
        font-weight: bold;
    }

    .loading-spinner {
        display: none;
        text-align: center;
        padding: 20px;
        color: #00ffff;
    }

    .error-message {
        background: rgba(255, 51, 102, 0.1);
        border: 1px solid #ff3366;
        color: #ff3366;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
    }

    .success-message {
        background: rgba(0, 255, 0, 0.1);
        border: 1px solid #00ff00;
        color: #00ff00;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
    }

    .empty-state {
        text-align: center;
        padding: 40px;
        color: #cccccc;
    }

    .empty-state i {
        font-size: 4rem;
        margin-bottom: 20px;
        color: #00ffff;
        opacity: 0.5;
    }

    /* Responsive design */
    @media (max-width: 768px) {
        .notification-center {
            padding: 10px;
        }
        
        .stats-container {
            grid-template-columns: repeat(2, 1fr);
        }
        
        .control-buttons {
            flex-direction: column;
        }
        
        .filter-controls {
            flex-direction: column;
            align-items: stretch;
        }
        
        .notification-header-row {
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
        }
        
        .notification-footer {
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="notification-center">
    <!-- Header Section -->
    <div class="notification-header">
        <h1><i class="fas fa-bell"></i> Notification Center</h1>
        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-number" id="unread-count">{{ unread_count }}</div>
                <div class="stat-label">Unread</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="total-count">{{ total_count }}</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="today-count">0</div>
                <div class="stat-label">Today</div>
            </div>
        </div>
    </div>

    <!-- Controls Section -->
    <div class="controls-section">
        <div class="control-buttons">
            <button class="cyber-btn" onclick="markAllAsRead()">
                <i class="fas fa-check-double"></i> Mark All Read
            </button>
            <button class="cyber-btn" onclick="refreshNotifications()">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
            <button class="cyber-btn" onclick="testNotification()">
                <i class="fas fa-vial"></i> Test Notification
            </button>
            <button class="cyber-btn danger" onclick="deleteAllRead()">
                <i class="fas fa-trash"></i> Delete All Read
            </button>
            <button class="cyber-btn" onclick="togglePreferences()">
                <i class="fas fa-cog"></i> Preferences
            </button>
        </div>

        <div class="filter-controls">
            <div class="filter-group">
                <label for="typeFilter">Type:</label>
                <select id="typeFilter" class="cyber-select" onchange="applyFilters()">
                    <option value="">All Types</option>
                    <option value="system_update">System Updates</option>
                    <option value="security_alert">Security Alerts</option>
                    <option value="course_update">Course Updates</option>
                    <option value="quiz_result">Quiz Results</option>
                    <option value="instructor_notice">Instructor Notices</option>
                    <option value="maintenance">Maintenance</option>
                    <option value="emergency">Emergency</option>
                    <option value="account_activity">Account Activity</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="statusFilter">Status:</label>
                <select id="statusFilter" class="cyber-select" onchange="applyFilters()">
                    <option value="">All</option>
                    <option value="unread">Unread</option>
                    <option value="read">Read</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="limitFilter">Per Page:</label>
                <select id="limitFilter" class="cyber-select" onchange="applyFilters()">
                    <option value="10">10</option>
                    <option value="20" selected>20</option>
                    <option value="50">50</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Messages -->
    <div id="message-container"></div>

    <!-- Notifications Container -->
    <div class="notifications-container">
        <h3><i class="fas fa-list"></i> Notifications</h3>
        <div id="notifications-list">
            <!-- Notifications will be loaded here -->
        </div>
        <div id="pagination-container"></div>
    </div>

    <!-- Preferences Section (Hidden by default) -->
    <div id="preferences-section" class="preferences-section" style="display: none;">
        <h3><i class="fas fa-cog"></i> Notification Preferences</h3>
        <div id="preferences-content">
            <!-- Preferences will be loaded here -->
        </div>
        <div style="margin-top: 20px;">
            <button class="cyber-btn" onclick="savePreferences()">
                <i class="fas fa-save"></i> Save Preferences
            </button>
            <button class="cyber-btn" onclick="togglePreferences()">
                <i class="fas fa-times"></i> Close
            </button>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div id="loading-spinner" class="loading-spinner">
        <i class="fas fa-spinner fa-spin"></i> Loading...
    </div>
</div>

<!-- Include Socket.IO for real-time updates -->
<script src="{{ url_for('static', filename='js/socket-client.js') }}"></script>

<script>
// Notification center JavaScript
let currentPage = 1;
let totalPages = 1;
let notifications = [];
let preferences = {{ preferences|safe }};

// Initialize the notification center
document.addEventListener('DOMContentLoaded', function() {
    loadNotifications();
    setupSocketListeners();
    loadTodayCount();
});

// Load notifications with current filters
function loadNotifications(page = 1) {
    const typeFilter = document.getElementById('typeFilter').value;
    const statusFilter = document.getElementById('statusFilter').value;
    const limit = document.getElementById('limitFilter').value;
    
    showLoading(true);
    
    const params = new URLSearchParams({
        page: page,
        limit: limit
    });
    
    if (typeFilter) params.append('type', typeFilter);
    if (statusFilter) params.append('read_status', statusFilter);
    
    fetch(`/user/api/notifications?${params}`)
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                notifications = data.notifications;
                currentPage = data.pagination.page;
                totalPages = data.pagination.total_pages;
                
                renderNotifications();
                renderPagination();
                updateStats();
            } else {
                showMessage('Error loading notifications: ' + data.error, 'error');
            }
        })
        .catch(error => {
            console.error('Error loading notifications:', error);
            showMessage('Failed to load notifications', 'error');
        })
        .finally(() => {
            showLoading(false);
        });
}

// Render notifications list
function renderNotifications() {
    const container = document.getElementById('notifications-list');
    
    if (notifications.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-inbox"></i>
                <h3>No notifications found</h3>
                <p>You're all caught up! No notifications match your current filters.</p>
            </div>
        `;
        return;
    }
    
    container.innerHTML = notifications.map(notification => `
        <div class="notification-item ${notification.is_read ? 'read' : 'unread'}" 
             data-id="${notification.id}">
            <div class="notification-header-row">
                <div class="notification-title">${escapeHtml(notification.title)}</div>
                <div class="notification-type">${notification.notification_type.replace('_', ' ').toUpperCase()}</div>
            </div>
            <div class="notification-message">${escapeHtml(notification.message)}</div>
            <div class="notification-footer">
                <div class="notification-time">
                    <i class="fas fa-clock"></i> ${formatDateTime(notification.created_at)}
                </div>
                <div class="notification-actions">
                    ${!notification.is_read ? `
                        <button class="action-btn" onclick="markAsRead(${notification.id})">
                            <i class="fas fa-check"></i> Mark Read
                        </button>
                    ` : ''}
                    <button class="action-btn delete" onclick="deleteNotification(${notification.id})">
                        <i class="fas fa-trash"></i> Delete
                    </button>
                </div>
            </div>
        </div>
    `).join('');
}

// Render pagination
function renderPagination() {
    const container = document.getElementById('pagination-container');
    
    if (totalPages <= 1) {
        container.innerHTML = '';
        return;
    }
    
    let paginationHTML = '<div class="pagination">';
    
    // Previous button
    paginationHTML += `
        <button onclick="loadNotifications(${currentPage - 1})" 
                ${currentPage <= 1 ? 'disabled' : ''}>
            <i class="fas fa-chevron-left"></i> Previous
        </button>
    `;
    
    // Page numbers (show current page and 2 pages before/after)
    const startPage = Math.max(1, currentPage - 2);
    const endPage = Math.min(totalPages, currentPage + 2);
    
    for (let i = startPage; i <= endPage; i++) {
        paginationHTML += `
            <button onclick="loadNotifications(${i})" 
                    class="${i === currentPage ? 'active' : ''}">
                ${i}
            </button>
        `;
    }
    
    // Next button
    paginationHTML += `
        <button onclick="loadNotifications(${currentPage + 1})" 
                ${currentPage >= totalPages ? 'disabled' : ''}>
            Next <i class="fas fa-chevron-right"></i>
        </button>
    `;
    
    paginationHTML += '</div>';
    container.innerHTML = paginationHTML;
}

// Apply filters and reload notifications
function applyFilters() {
    currentPage = 1;
    loadNotifications();
}

// Mark specific notification as read
function markAsRead(notificationId) {
    fetch('/user/api/notifications/mark-read', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            notification_ids: [notificationId]
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            showMessage(data.message, 'success');
            loadNotifications(currentPage);
        } else {
            showMessage('Error: ' + data.error, 'error');
        }
    })
    .catch(error => {
        console.error('Error marking as read:', error);
        showMessage('Failed to mark as read', 'error');
    });
}

// Mark all notifications as read
function markAllAsRead() {
    if (!confirm('Mark all notifications as read?')) return;
    
    fetch('/user/api/notifications/mark-read', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            mark_all: true
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            showMessage(data.message, 'success');
            loadNotifications(currentPage);
        } else {
            showMessage('Error: ' + data.error, 'error');
        }
    })
    .catch(error => {
        console.error('Error marking all as read:', error);
        showMessage('Failed to mark all as read', 'error');
    });
}

// Delete specific notification
function deleteNotification(notificationId) {
    if (!confirm('Delete this notification?')) return;
    
    fetch('/user/api/notifications/delete', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            notification_ids: [notificationId]
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            showMessage(data.message, 'success');
            loadNotifications(currentPage);
        } else {
            showMessage('Error: ' + data.error, 'error');
        }
    })
    .catch(error => {
        console.error('Error deleting notification:', error);
        showMessage('Failed to delete notification', 'error');
    });
}

// Delete all read notifications
function deleteAllRead() {
    if (!confirm('Delete all read notifications? This action cannot be undone.')) return;
    
    fetch('/user/api/notifications/delete', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            delete_all_read: true
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            showMessage(data.message, 'success');
            loadNotifications(currentPage);
        } else {
            showMessage('Error: ' + data.error, 'error');
        }
    })
    .catch(error => {
        console.error('Error deleting read notifications:', error);
        showMessage('Failed to delete read notifications', 'error');
    });
}

// Create test notification
function testNotification() {
    fetch('/user/api/notifications/test', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            showMessage('Test notification created successfully', 'success');
            loadNotifications(currentPage);
        } else {
            showMessage('Error: ' + data.error, 'error');
        }
    })
    .catch(error => {
        console.error('Error creating test notification:', error);
        showMessage('Failed to create test notification', 'error');
    });
}

// Toggle preferences section
function togglePreferences() {
    const section = document.getElementById('preferences-section');
    if (section.style.display === 'none') {
        loadPreferences();
        section.style.display = 'block';
    } else {
        section.style.display = 'none';
    }
}

// Load notification preferences
function loadPreferences() {
    fetch('/user/api/notifications/preferences')
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                preferences = data.preferences;
                renderPreferences();
            } else {
                showMessage('Error loading preferences: ' + data.error, 'error');
            }
        })
        .catch(error => {
            console.error('Error loading preferences:', error);
            showMessage('Failed to load preferences', 'error');
        });
}

// Render preferences form
function renderPreferences() {
    const container = document.getElementById('preferences-content');
    
    container.innerHTML = `
        <div class="preferences-grid">
            <div class="preference-group">
                <h4>General Settings</h4>
                <div class="preference-item">
                    <label>Enable notifications</label>
                    <input type="checkbox" class="cyber-checkbox" id="pref-enabled" 
                           ${preferences.enabled ? 'checked' : ''}>
                </div>
                <div class="preference-item">
                    <label>Sound notifications</label>
                    <input type="checkbox" class="cyber-checkbox" id="pref-sound" 
                           ${preferences.sound_enabled ? 'checked' : ''}>
                </div>
                <div class="preference-item">
                    <label>Browser notifications</label>
                    <input type="checkbox" class="cyber-checkbox" id="pref-browser" 
                           ${preferences.browser_notifications ? 'checked' : ''}>
                </div>
            </div>
            
            <div class="preference-group">
                <h4>Do Not Disturb</h4>
                <div class="preference-item">
                    <label>Enable DND</label>
                    <input type="checkbox" class="cyber-checkbox" id="pref-dnd" 
                           ${preferences.dnd_enabled ? 'checked' : ''}>
                </div>
                <div class="preference-item">
                    <label>Start time</label>
                    <input type="time" class="cyber-input" id="pref-dnd-start" 
                           value="${preferences.dnd_start_time || '22:00'}">
                </div>
                <div class="preference-item">
                    <label>End time</label>
                    <input type="time" class="cyber-input" id="pref-dnd-end" 
                           value="${preferences.dnd_end_time || '08:00'}">
                </div>
            </div>
            
            ${Object.entries(preferences.preferences || {}).map(([type, channels]) => `
                <div class="preference-group">
                    <h4>${type.replace('_', ' ').toUpperCase()}</h4>
                    <div class="preference-item">
                        <label>Email notifications</label>
                        <input type="checkbox" class="cyber-checkbox" 
                               id="pref-${type}-email" 
                               ${channels.email ? 'checked' : ''}>
                    </div>
                    <div class="preference-item">
                        <label>Real-time notifications</label>
                        <input type="checkbox" class="cyber-checkbox" 
                               id="pref-${type}-websocket" 
                               ${channels.websocket ? 'checked' : ''}>
                    </div>
                </div>
            `).join('')}
        </div>
    `;
}

// Save preferences
function savePreferences() {
    const updatedPreferences = {
        enabled: document.getElementById('pref-enabled').checked,
        sound_enabled: document.getElementById('pref-sound').checked,
        browser_notifications: document.getElementById('pref-browser').checked,
        dnd_enabled: document.getElementById('pref-dnd').checked,
        dnd_start_time: document.getElementById('pref-dnd-start').value,
        dnd_end_time: document.getElementById('pref-dnd-end').value,
        preferences: {}
    };
    
    // Collect notification type preferences
    Object.keys(preferences.preferences || {}).forEach(type => {
        const emailCheckbox = document.getElementById(`pref-${type}-email`);
        const websocketCheckbox = document.getElementById(`pref-${type}-websocket`);
        
        if (emailCheckbox && websocketCheckbox) {
            updatedPreferences.preferences[type] = {
                email: emailCheckbox.checked,
                websocket: websocketCheckbox.checked
            };
        }
    });
    
    fetch('/user/api/notifications/preferences', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(updatedPreferences)
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            showMessage('Preferences saved successfully', 'success');
            preferences = data.preferences;
        } else {
            showMessage('Error saving preferences: ' + data.error, 'error');
        }
    })
    .catch(error => {
        console.error('Error saving preferences:', error);
        showMessage('Failed to save preferences', 'error');
    });
}

// Refresh notifications
function refreshNotifications() {
    loadNotifications(currentPage);
}

// Load today's notification count
function loadTodayCount() {
    fetch('/user/api/notifications/stats')
        .then(response => response.json())
        .then(data => {
            if (data.success && data.stats.weekly_activity) {
                const today = data.stats.weekly_activity[0];
                document.getElementById('today-count').textContent = today.count;
            }
        })
        .catch(error => {
            console.error('Error loading today count:', error);
        });
}

// Update stats display
function updateStats() {
    fetch('/user/api/notifications/stats')
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                const stats = data.stats.overall;
                document.getElementById('unread-count').textContent = stats.unread_count;
                document.getElementById('total-count').textContent = stats.total_count;
            }
        })
        .catch(error => {
            console.error('Error updating stats:', error);
        });
}

// Setup Socket.IO listeners for real-time updates
function setupSocketListeners() {
    if (typeof socket !== 'undefined') {
        socket.on('notification_sent', function(data) {
            // Refresh notifications when new one arrives
            loadNotifications(currentPage);
            updateStats();
            
            // Show browser notification if enabled
            if (preferences.browser_notifications && 'Notification' in window) {
                if (Notification.permission === 'granted') {
                    new Notification(data.title, {
                        body: data.message,
                        icon: '/static/img/logo.png'
                    });
                }
            }
        });
    }
}

// Utility functions
function showMessage(message, type) {
    const container = document.getElementById('message-container');
    const messageDiv = document.createElement('div');
    messageDiv.className = type === 'error' ? 'error-message' : 'success-message';
    messageDiv.textContent = message;
    
    container.appendChild(messageDiv);
    
    // Auto-remove after 5 seconds
    setTimeout(() => {
        if (messageDiv.parentNode) {
            messageDiv.parentNode.removeChild(messageDiv);
        }
    }, 5000);
}

function showLoading(show) {
    document.getElementById('loading-spinner').style.display = show ? 'block' : 'none';
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function formatDateTime(dateString) {
    const date = new Date(dateString);
    return date.toLocaleString();
}

// Request notification permission on page load
if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
}
</script>
