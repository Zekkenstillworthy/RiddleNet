{% extends "user/base.html" %}

{% block head %}
<title>Quiz Challenge | RiddleNet</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/force-landscape.css') }}">
<style>
    /* Smooth scrolling for mobile */
    html {
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
        height: 100%;
    }

    body {
        min-height: 100vh;
        height: auto;
    }

    /* Prevent zoom on input focus for iOS */
    input, select, textarea, button {
        font-size: 16px;
    }

    .quiz-container {
        max-width: 900px;
        margin: 0 auto;
        padding: 20px;
        box-sizing: border-box;
        width: 100%;
    }

   

    

    .quiz-title {
        font-size: 2rem;
        font-weight: 700;
        background: var(--gradient-primary);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 8px;
        font-family: 'Orbitron', monospace;
    }

    .quiz-subtitle {
        color: var(--text-secondary);
        font-size: 1rem;
    }

    .quiz-stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        margin-bottom: 24px;
    }

    .stat-card {
        background: var(--glass-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 16px;
        text-align: center;
        transition: all 0.3s ease;
    }

    .stat-card:hover {
        transform: translateY(-2px);
        border-color: var(--cyber-glow);
        box-shadow: 0 8px 24px rgba(0, 212, 255, 0.2);
    }

    .stat-label {
        color: var(--text-secondary);
        font-size: 0.875rem;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .stat-value {
        color: var(--cyber-glow);
        font-size: 1.5rem;
        font-weight: 700;
        font-family: 'Orbitron', monospace;
    }

    .progress-bar-container {
        background: rgba(0, 0, 0, 0.3);
        border-radius: 12px;
        height: 12px;
        overflow: hidden;
        margin-bottom: 24px;
        border: 1px solid var(--border-color);
    }

    .progress-bar {
        height: 100%;
        background: var(--gradient-primary);
        transition: width 0.3s ease;
        box-shadow: 0 0 10px var(--cyber-glow);
    }

    .question-card {
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        border: 2px solid var(--border-color);
        border-radius: var(--border-radius);
        padding: 32px;
        margin-bottom: 24px;
        position: relative;
        animation: slideIn 0.4s ease-out;
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .question-number {
        color: var(--cyber-glow);
        font-size: 0.875rem;
        font-weight: 600;
        margin-bottom: 16px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .question-text {
        color: var(--text-primary);
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 24px;
        line-height: 1.6;
    }

    .question-image {
        width: 100%;
        max-width: 600px;
        height: auto;
        margin: 20px auto;
        display: block;
        border-radius: 12px;
        border: 2px solid var(--border-color);
        box-shadow: 0 4px 20px rgba(0, 212, 255, 0.2);
        background: rgba(255, 255, 255, 0.05);
        padding: 15px;
    }

    .question-image:hover {
        border-color: var(--cyber-glow);
        box-shadow: 0 6px 30px rgba(0, 212, 255, 0.4);
        transform: scale(1.02);
        transition: all 0.3s ease;
    }

    .options-container {
        display: grid;
        gap: 12px;
    }

    .option-btn {
        background: rgba(26, 43, 71, 0.6);
        border: 2px solid var(--border-color);
        border-radius: 12px;
        padding: 16px 20px;
        color: var(--text-primary);
        font-size: 1rem;
        text-align: left;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .option-btn:hover:not(.disabled) {
        background: rgba(0, 212, 255, 0.1);
        border-color: var(--cyber-glow);
        transform: translateX(4px);
    }

    .option-btn.selected {
        background: rgba(0, 212, 255, 0.2);
        border-color: var(--cyber-glow);
        box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
    }

    .option-btn.correct {
        background: rgba(0, 255, 136, 0.2);
        border-color: var(--success-color);
        box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
    }

    .option-btn.wrong {
        background: rgba(255, 71, 87, 0.2);
        border-color: var(--danger-color);
        box-shadow: 0 0 20px rgba(255, 71, 87, 0.3);
    }

    .option-btn.disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .option-btn.hidden {
        display: none;
    }

    .option-letter {
        background: var(--gradient-primary);
        color: white;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        flex-shrink: 0;
    }

    .lifelines-container {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
        flex-wrap: wrap;
    }

    .lifeline-btn {
        background: var(--surface);
        border: 2px solid var(--cyber-glow);
        border-radius: 12px;
        padding: 12px 20px;
        color: var(--text-primary);
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .lifeline-btn:hover:not(.disabled) {
        background: var(--cyber-glow);
        color: var(--primary-color);
        transform: scale(1.05);
        box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
    }

    .lifeline-btn.disabled {
        opacity: 0.3;
        cursor: not-allowed;
        border-color: var(--text-muted);
    }

    .lifeline-btn i {
        font-size: 1rem;
    }

    /* Next Question Button - Highlighted style */
    .next-question-btn {
        background: linear-gradient(135deg, var(--success-color), #00D9FF) !important;
        border: 2px solid var(--success-color) !important;
        font-weight: 600;
        animation: pulseGlow 2s ease-in-out infinite;
        flex-grow: 1;
        min-width: 150px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .next-question-btn:hover:not(.disabled) {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
    }

    .next-question-btn i {
        font-size: 1rem;
    }

    @keyframes pulseGlow {
        0%, 100% {
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
        }
        50% {
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.8);
        }
    }

    .feedback-container {
        background: var(--glass-bg);
        border-radius: 12px;
        padding: 20px;
        margin: 0;
        border-left: 4px solid;
        animation: slideIn 0.3s ease-out;
    }

    .feedback-container.correct {
        border-left-color: var(--success-color);
        background: rgba(0, 255, 136, 0.1);
    }

    .feedback-container.wrong {
        border-left-color: var(--danger-color);
        background: rgba(255, 71, 87, 0.1);
    }

    .feedback-title {
        font-weight: 700;
        font-size: 1.1rem;
        margin-bottom: 8px;
    }

    .feedback-text {
        color: var(--text-secondary);
        line-height: 1.6;
    }

    .action-buttons {
        display: flex;
        gap: 12px;
        margin-top: 24px;
    }

    .action-btn {
        flex: 1;
        background: var(--gradient-primary);
        border: none;
        border-radius: 12px;
        padding: 14px 24px;
        color: white;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .action-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(0, 212, 255, 0.4);
    }

    .action-btn.secondary {
        background: var(--surface);
        border: 2px solid var(--cyber-glow);
    }

    .results-container {
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        border: 2px solid var(--border-color);
        border-radius: var(--border-radius-lg);
        padding: 40px;
        text-align: center;
        animation: slideIn 0.5s ease-out;
    }

    .results-title {
        font-size: 2.5rem;
        font-weight: 700;
        background: var(--gradient-primary);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 16px;
        font-family: 'Orbitron', monospace;
    }

    .results-score {
        font-size: 4rem;
        font-weight: 900;
        color: var(--cyber-glow);
        margin: 24px 0;
        text-shadow: 0 0 20px var(--cyber-glow);
        font-family: 'Orbitron', monospace;
    }

    .results-stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 16px;
        margin: 32px 0;
    }

    .result-stat {
        background: rgba(26, 43, 71, 0.6);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 16px;
    }

    .result-stat-value {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--cyber-glow);
        margin-bottom: 4px;
    }

    .result-stat-label {
        color: var(--text-secondary);
        font-size: 0.875rem;
    }

    .hint-container {
        background: rgba(255, 140, 66, 0.1);
        border: 1px solid var(--warning-color);
        border-radius: 12px;
        padding: 16px;
        margin-top: 16px;
        display: none;
        animation: slideIn 0.3s ease-out;
    }

    .hint-container.show {
        display: block;
    }

    .hint-title {
        color: var(--warning-color);
        font-weight: 700;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .hint-text {
        color: var(--text-secondary);
    }

};

let answered = false;

let completedSets = []; // Track which sets have been completed

// Shuffle array function (Fisher-Yates algorithm)
function shuffleArray(array) {
    const shuffled = [...array]; // Create a copy to avoid mutating original
    for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled;
}

// Initialize Quiz
document.addEventListener('DOMContentLoaded', function() {
    // Generate unique session ID
    quizSessionId = Date.now() + '-' + Math.random().toString(36).substr(2, 9);
    
    // Try to load saved progress from server
    loadSavedProgress();
});

// Load saved progress from server
function loadSavedProgress() {
    fetch('/quiz/api/get_progress', {
        method: 'GET',
        headers: {
            'Content-Type': 'application/json'
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.has_progress) {
            // Show resume dialog
            showResumeDialog(data);
        } else {
            // Start fresh quiz
            startNewQuiz();
        }
    })
    .catch(error => {
        console.error('Error loading progress:', error);
        // Start fresh quiz on error
        startNewQuiz();
    });
}

// Show resume dialog
function showResumeDialog(savedData) {
    const progress = savedData.progress;

    const currentSetValue = progress.currentSet !== undefined ? progress.currentSet : Math.floor(progress.currentQuestion / 5);

// Resume quiz from saved progress
function resumeQuiz() {
    console.log('[MVP] Resuming quiz from saved progress...');
    
    fetch('/quiz/api/get_progress', {
        method: 'GET',
        headers: {
            'Content-Type': 'application/json'
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.has_progress) {
            const savedProgress = data.progress;
            
            console.log(`[MVP] Resuming at question ${savedProgress.currentQuestion + 1}`);
            
            // Restore quiz state
            currentQuestion = savedProgress.currentQuestion;
            currentSet = savedProgress.currentSet || 0;
            completedSets = savedProgress.completedSets || [];
            score = savedProgress.score;
            answeredQuestions = savedProgress.answeredQuestions || [];
            lifelinesUsed = savedProgress.lifelinesUsed || { fiftyFifty: 0, skip: 0, hint: 0 };
            skipsRemaining = 2 - lifelinesUsed.skip;
            hintsRemaining = 3 - lifelinesUsed.hint;
            fiftyFiftyUsed = lifelinesUsed.fiftyFifty > 0;
            
            // Restore question order
            if (savedProgress.questionOrder && savedProgress.questionOrder.length > 0) {
                quizQuestions = savedProgress.questionOrder;
            } else {
                // If no saved order, shuffle fresh
                questionSets.forEach(set => {
                    const shuffledSet = shuffleArray(set);
                    quizQuestions = quizQuestions.concat(shuffledSet);
                });
                quizQuestions = shuffleArray(quizQuestions);
            }
            
            // Update UI
            document.getElementById('score').textContent = score;
            document.getElementById('resultsContainer').style.display = 'none';
            document.getElementById('questionContainer').style.display = 'block';
            document.getElementById('lifelinesContainer').style.display = 'flex';
            document.querySelector('.quiz-stats').style.display = 'grid';
            document.querySelector('.progress-bar-container').style.display = 'block';
            
            // Update lifeline buttons
            updateLifelineButtons();
            
            // Load current question ONLY ONCE - no duplicate rendering
            console.log('[MVP] Loading resumed question (NO DUPLICATE)');
            loadQuestion();
        }
    })
    .catch(error => {
        console.error('Error resuming quiz:', error);
        startNewQuiz();
    });
}

// Start a new quiz
function startNewQuiz() {
    // Reset all state
    currentQuestion = 0;
    currentSet = 0;
    completedSets = [];
    score = 0;
    answeredQuestions = [];
    lifelinesUsed = { fiftyFifty: 0, skip: 0, hint: 0 };
    skipsRemaining = 2;
    hintsRemaining = 3;
    fiftyFiftyUsed = false;
    quizQuestions = [];
    
    // Shuffle questions
    questionSets.forEach(set => {
        const shuffledSet = shuffleArray(set);
        quizQuestions = quizQuestions.concat(shuffledSet);
    });
    quizQuestions = shuffleArray(quizQuestions);
    
    // Clear saved progress on server
    clearSavedProgress();
    
    // Update UI
    document.getElementById('score').textContent = '0';
    document.getElementById('resultsContainer').style.display = 'none';
    document.getElementById('questionContainer').style.display = 'block';
    document.getElementById('lifelinesContainer').style.display = 'flex';
    document.querySelector('.quiz-stats').style.display = 'grid';
    document.querySelector('.progress-bar-container').style.display = 'block';
    
    // Reset lifeline buttons
    updateLifelineButtons();
    
    loadQuestion();
    startTimer();
}

// Update lifeline button states
function updateLifelineButtons() {
    const fiftyBtn = document.getElementById('fiftyFiftyBtn');
    const skipBtn = document.getElementById('skipBtn');
    const hintBtn = document.getElementById('hintBtn');
    
    if (fiftyBtn) {
        if (fiftyFiftyUsed) {
            fiftyBtn.classList.add('disabled');
        } else {
            fiftyBtn.classList.remove('disabled');
        }
    }
    
    if (skipBtn) {
        skipBtn.innerHTML = `<i class="fas fa-forward"></i> Skip (${skipsRemaining})`;
        if (skipsRemaining <= 0) {
            skipBtn.classList.add('disabled');
        } else {
            skipBtn.classList.remove('disabled');
        }
    }
    
    if (hintBtn) {
        hintBtn.innerHTML = `<i class="fas fa-lightbulb"></i> Hint (${hintsRemaining})`;
        if (hintsRemaining <= 0) {
            hintBtn.classList.add('disabled');
        } else {
            hintBtn.classList.remove('disabled');
        }
    }
}

// Start Timer
function startTimer() {
    console.log('[MVP] Starting 30-second countdown timer');
    
    timeLeft = 30;
    updateTimer();
    
    if (timerInterval) {
        console.log('[MVP] Clearing existing timer interval');
        clearInterval(timerInterval);
    }
    
    timerInterval = setInterval(() => {
        timeLeft--;
        updateTimer();
        
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            console.log('[MVP] Timer expired - handling timeout');
            handleTimeout();
        }
    }, 1000);
}

// Update Timer Display
function updateTimer() {
    const timerEl = document.getElementById('timer');
    timerEl.textContent = timeLeft;
    
    // Change color based on time remaining
    if (timeLeft <= 10) {
        timerEl.style.color = 'var(--danger-color)';
    } else if (timeLeft <= 20) {
        timerEl.style.color = 'var(--warning-color)';
    } else {
        timerEl.style.color = 'var(--cyber-glow)';
    }
}

// Load Question
function loadQuestion() {
    // MVP: Prevent duplicate rendering
    if (isLoadingQuestion) {
        console.warn('[MVP DUPLICATE] Question already loading, skipping duplicate call');
        return;
    }
    
    isLoadingQuestion = true;
    console.log(`[MVP] Loading question ${currentQuestion + 1}/${quizQuestions.length}`);
    
    if (currentQuestion >= quizQuestions.length) {
        isLoadingQuestion = false;
        showResults();
        return;
    }
    
    const question = quizQuestions[currentQuestion];
    answered = false;
    
    // Calculate which set and question within set
    currentSet = Math.floor(currentQuestion / 5);
    const questionInSet = (currentQuestion % 5) + 1;
    const totalSets = 3;
    
    // Update progress
    document.getElementById('progress').textContent = `Set ${currentSet + 1}/${totalSets} - Q${questionInSet}/5`;
    const progressPercent = ((currentQuestion) / quizQuestions.length) * 100;
    document.getElementById('progressBar').style.width = progressPercent + '%';
    
    // Build question HTML
    let html = `
        <div class="question-card">
            <div class="question-number">Set ${currentSet + 1} - Question ${questionInSet} of 5</div>
            <div class="question-text">${question.question}</div>
            ${question.image ? `<img src="${question.image}" alt="Question Image" class="question-image" />` : ''}
            <div class="options-container">
    `;
    
    question.options.forEach((option, index) => {
        const letter = String.fromCharCode(65 + index); // A, B, C, D
        html += `
            <button class="option-btn" onclick="selectAnswer(${index})" data-index="${index}">
                <div class="option-letter">${letter}</div>
                <div class="option-text">${option}</div>
            </button>
        `;
    });
    
    html += `
            </div>
            <div class="hint-container" id="hintContainer">
                <div class="hint-title">
                    <i class="fas fa-lightbulb"></i>
                    Hint
                </div>
                <div class="hint-text">${question.hint}</div>
            </div>
        </div>
    `;
    
    document.getElementById('questionContainer').innerHTML = html;
    
    // Hide next question button
    const nextBtn = document.getElementById('nextQuestionBtn');
    if (nextBtn) {
        nextBtn.style.display = 'none';
    }
    
    // Reset lifeline state for new question
    fiftyFiftyUsed = false;
    
    // Start new timer
    startTimer();
    
    // MVP: Reset loading flag after question is fully loaded
    isLoadingQuestion = false;
}

// Select Answer
function selectAnswer(index) {
    if (answered) return;
    
    answered = true;
    clearInterval(timerInterval);
    
    const question = quizQuestions[currentQuestion];
    const options = document.querySelectorAll('.option-btn');
    const selectedOption = options[index];
    
    // Disable all options
    options.forEach(opt => opt.classList.add('disabled'));
    
    // Show correct/wrong feedback
    if (index === question.correct) {
        selectedOption.classList.add('correct');
        score++;
        document.getElementById('score').textContent = score;
        showFeedback(true, question.explanation);
    } else {
        selectedOption.classList.add('wrong');
        options[question.correct].classList.add('correct');
        showFeedback(false, question.explanation);
    }
    
    // Record answer
    answeredQuestions.push({
        question: currentQuestion,
        selected: index,
        correct: question.correct,
        isCorrect: index === question.correct
    });
    
    // Show next button
    setTimeout(() => {
        showNextButton();
    }, 1000);
}

// Show Feedback
function showFeedback(isCorrect, explanation) {
    // Get the question text element and replace it with explanation
    const questionText = document.querySelector('.question-text');
    const questionNumber = document.querySelector('.question-number');
    
    if (questionText) {
        // Update the question number to show result
        if (questionNumber) {
            questionNumber.innerHTML = `<i class="fas fa-${isCorrect ? 'check-circle' : 'times-circle'}"></i> ${isCorrect ? 'Correct Answer!' : 'Incorrect Answer'}`;
            questionNumber.style.color = isCorrect ? 'var(--success-color)' : 'var(--danger-color)';
        }
        
        // Replace question with explanation - keeping the same styling
        questionText.innerHTML = `
            <div style="color: ${isCorrect ? 'var(--success-color)' : 'var(--danger-color)'}; margin-bottom: 16px; font-weight: 700;">
            </div>
            <div>
                ${explanation}
            </div>
        `;
        
        // Add subtle background highlight only
        questionText.style.background = isCorrect ? 'rgba(0, 255, 136, 0.05)' : 'rgba(255, 71, 87, 0.05)';
        questionText.style.borderLeft = `4px solid ${isCorrect ? 'var(--success-color)' : 'var(--danger-color)'}`;
        questionText.style.paddingLeft = '20px';
        questionText.style.borderRadius = '8px';
    }
}

// Show Next Button
function showNextButton() {
    const nextBtn = document.getElementById('nextQuestionBtn');
    const nextBtnText = document.getElementById('nextQuestionText');
    const questionInSet = (currentQuestion % 5) + 1;
    const isLastInSet = questionInSet === 5;
    
    // Update button text
    if (isLastInSet) {
        nextBtnText.innerHTML = 'Complete Set';
        nextBtn.querySelector('i').className = 'fas fa-check-circle';
    } else {
        nextBtnText.innerHTML = 'Next Question';
        nextBtn.querySelector('i').className = 'fas fa-arrow-right';
    }
    
    // Show the button with animation
    nextBtn.style.display = 'flex';
    setTimeout(() => {
        nextBtn.style.animation = 'pulseGlow 2s ease-in-out infinite';
    }, 100);
}

// Quit Quiz - Save progress and return to challenges (keep this for back button)
function quitQuiz() {
    saveProgress();
    setTimeout(() => {
        window.location.href = "{{ url_for('user.challenges') }}";
    }, 300);
}

// Next Question
function nextQuestion() {
    // Hide the next button immediately
    const nextBtn = document.getElementById('nextQuestionBtn');
    if (nextBtn) {
        nextBtn.style.display = 'none';
    }
    
    currentQuestion++;
    
    // Check if we just completed a set (every 5 questions)
    if (currentQuestion % 5 === 0 && currentQuestion < quizQuestions.length) {
        const completedSetNumber = Math.floor((currentQuestion - 1) / 5);
        completedSets.push(completedSetNumber);
        showSetCompletionScreen(completedSetNumber);
    } else {
        // Save progress after each question
        saveProgress();
        loadQuestion();
    }
}

                            <div style="color: var(--text-secondary); font-size: 0.9rem;">Total Score</div>
                        </div>
                    </div>
                    <div style="margin-top: 24px; padding: 16px; background: var(--card-bg); border-radius: 12px;">
                        <div style="font-size: 1.1rem; color: var(--primary-color); font-weight: 700;">
                            <i class="fas fa-clock"></i> Auto-continuing in <span id="autoCountdown">5</span> seconds...
                        </div>
                    </div>
                </div>
            `;
            
            document.getElementById('questionContainer').innerHTML = fallbackHTML;
            
            let countdown = 5;
            const countdownInterval = setInterval(() => {
                countdown--;
                const countdownEl = document.getElementById('autoCountdown');
                if (countdownEl) {
                    countdownEl.textContent = countdown;
                }
                
                if (countdown <= 0) {
                    clearInterval(countdownInterval);
                    continueToNextSet();
                }
            }, 1000);
        });
}

// Continue to next set
function continueToNextSet() {
    console.log('[MVP] Continuing to next set/question...');
    
    // Restore quiz UI (only needed if we were showing results, but with MVP we stay in questionContainer)
    document.getElementById('resultsContainer').style.display = 'none';
    document.getElementById('questionContainer').style.display = 'block';
    document.getElementById('lifelinesContainer').style.display = 'flex';
    document.querySelector('.quiz-stats').style.display = 'grid';
    document.querySelector('.progress-bar-container').style.display = 'block';
    
    // Load next question
    loadQuestion();
}

// Quit quiz from set completion screen
function quitQuizFromSetCompletion() {
    saveProgress();
    setTimeout(() => {
        window.location.href = "{{ url_for('user.challenges') }}";
    }, 300);
}

// Save progress to server
function saveProgress() {
    fetch('/quiz/api/save_progress', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            currentQuestion: currentQuestion,
            currentSet: currentSet,
            completedSets: completedSets,
            score: score,
            answeredQuestions: answeredQuestions,
            lifelinesUsed: lifelinesUsed,
            questionOrder: quizQuestions,
            totalQuestions: quizQuestions.length,
            sessionId: quizSessionId
        })
    })
    .then(response => response.json())
    .then(data => {
        console.log('Progress saved:', data);
    })
    .catch(error => {
        console.error('Error saving progress:', error);
    });
}

// Clear saved progress
function clearSavedProgress() {
    fetch('/quiz/api/clear_progress', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        }
    })
    .then(response => response.json())
    .then(data => {
        console.log('Progress cleared:', data);
    })
    .catch(error => {
        console.error('Error clearing progress:', error);
    });
}

// Handle Timeout
function handleTimeout() {
    if (answered) return;
    
    answered = true;
    const question = quizQuestions[currentQuestion];
    const options = document.querySelectorAll('.option-btn');
    
    // Disable all options
    options.forEach(opt => opt.classList.add('disabled'));
    
    // Show correct answer
    options[question.correct].classList.add('correct');
    
    // Update question text to show timeout feedback
    const questionText = document.querySelector('.question-text');
    const questionNumber = document.querySelector('.question-number');
    
    if (questionText) {
        // Update the question number to show timeout
        if (questionNumber) {
            questionNumber.innerHTML = `<i class="fas fa-clock"></i> Time's Up!`;
            questionNumber.style.color = 'var(--danger-color)';
        }
        
        // Replace question with explanation - keeping the same styling
        questionText.innerHTML = `
            
            <div>
                ${question.explanation}
            </div>
        `;
        
        // Add subtle background highlight
        questionText.style.background = 'rgba(255, 71, 87, 0.05)';
        questionText.style.borderLeft = '4px solid var(--danger-color)';
        questionText.style.paddingLeft = '20px';
        questionText.style.borderRadius = '8px';
    }
    
    // Record as incorrect
    answeredQuestions.push({
        question: currentQuestion,
        selected: -1,
        correct: question.correct,
        isCorrect: false
    });
    
    setTimeout(() => {
        showNextButton();
        
        // MVP: Auto-advance after 3 seconds
        console.log('[MVP] Timer expired - Auto-advancing to next question in 3 seconds...');
        setTimeout(() => {
            nextQuestion();
        }, 3000);
    }, 1000);
}

// Lifeline: 50/50
function useFiftyFifty() {
    if (fiftyFiftyUsed || answered) return;
    
    fiftyFiftyUsed = true;
    lifelinesUsed.fiftyFifty++;
    
    const btn = document.getElementById('fiftyFiftyBtn');
    btn.classList.add('disabled');
    
    const question = quizQuestions[currentQuestion];
    const options = document.querySelectorAll('.option-btn');
    let incorrectOptions = [];
    
    // Find incorrect options
    options.forEach((opt, index) => {
        if (index !== question.correct) {
            incorrectOptions.push(index);
        }
    });
    
    // Randomly remove 2 incorrect options
    for (let i = 0; i < 2 && incorrectOptions.length > 0; i++) {
        const randomIndex = Math.floor(Math.random() * incorrectOptions.length);
        const optionIndex = incorrectOptions[randomIndex];
        options[optionIndex].classList.add('hidden');
        incorrectOptions.splice(randomIndex, 1);
    }
}

// Lifeline: Skip
function useSkip() {
    if (skipsRemaining <= 0 || answered) return;
    
    skipsRemaining--;
    lifelinesUsed.skip++;
    
    const btn = document.getElementById('skipBtn');
    if (btn) {
        btn.innerHTML = `<i class="fas fa-forward"></i> Skip (${skipsRemaining})`;
        
        if (skipsRemaining <= 0) {
            btn.classList.add('disabled');
        }
    }
    
    // Skip to next question
    currentQuestion++;
    clearInterval(timerInterval);
    loadQuestion();
}

// Lifeline: Hint
function useHint() {
    if (hintsRemaining <= 0 || answered) return;
    
    hintsRemaining--;
    lifelinesUsed.hint++;
    
    const btn = document.getElementById('hintBtn');
    if (btn) {
        btn.innerHTML = `<i class="fas fa-lightbulb"></i> Hint (${hintsRemaining})`;
        
        if (hintsRemaining <= 0) {
            btn.classList.add('disabled');
        }
    }
    
    // Show hint
    const hintContainer = document.getElementById('hintContainer');
    if (hintContainer) {
        hintContainer.classList.add('show');
    }
}

// Show Results
function showResults() {
    clearInterval(timerInterval);
    
    const questionsAnswered = answeredQuestions.length;
    const percentage = Math.round((score / questionsAnswered) * 100);
    const timeTaken = (questionsAnswered * 30) - timeLeft; // Approximate
    const setsCompleted = completedSets.length + (currentQuestion % 5 === 0 ? 1 : 0);
    
    let performanceMessage = '';
    if (percentage >= 90) {
        performanceMessage = '🏆 Outstanding! You\'re a networking expert!';
    } else if (percentage >= 70) {
        performanceMessage = '🌟 Great job! You know your stuff!';
    } else if (percentage >= 50) {
        performanceMessage = '👍 Good effort! Keep learning!';
    } else {
        performanceMessage = '📚 Keep practicing! You\'ll get there!';
    }
    
    const resultsHTML = `
        <div class="results-container">
            <div class="results-title">Quiz Complete!</div>
            <div class="results-score">${score}/${questionsAnswered}</div>
            <p style="color: var(--text-secondary); font-size: 1.2rem; margin-bottom: 24px;">
                ${performanceMessage}
            </p>
            <div class="results-stats">
                <div class="result-stat">
                    <div class="result-stat-value">${percentage}%</div>
                    <div class="result-stat-label">Accuracy</div>
                </div>
                <div class="result-stat">
                    <div class="result-stat-value">${setsCompleted}/3</div>
                    <div class="result-stat-label">Sets Completed</div>
                </div>
                <div class="result-stat">
                    <div class="result-stat-value">${lifelinesUsed.fiftyFifty}</div>
                    <div class="result-stat-label">50/50 Used</div>
                </div>
                <div class="result-stat">
                    <div class="result-stat-value">${lifelinesUsed.skip}</div>
                    <div class="result-stat-label">Skips Used</div>
                </div>
                <div class="result-stat">
                    <div class="result-stat-value">${lifelinesUsed.hint}</div>
                    <div class="result-stat-label">Hints Used</div>
                </div>
            </div>
            <div class="action-buttons">
                <button class="action-btn" onclick="retakeQuiz()">
                    <i class="fas fa-redo"></i> Retake Quiz
                </button>
                <button class="action-btn secondary" onclick="window.location.href='{{ url_for('user.dashboard') }}'">
                    <i class="fas fa-home"></i> Dashboard
                </button>
            </div>
        </div>
    `;
    
    document.getElementById('questionContainer').style.display = 'none';
    document.getElementById('lifelinesContainer').style.display = 'none';
    document.querySelector('.quiz-stats').style.display = 'none';
    document.querySelector('.progress-bar-container').style.display = 'none';
    document.getElementById('resultsContainer').innerHTML = resultsHTML;
    document.getElementById('resultsContainer').style.display = 'block';
    
    // Submit results to server
    submitQuizResults();
}

// Submit Quiz Results
function submitQuizResults() {
    const questionsAnswered = answeredQuestions.length;
    
    fetch('/quiz/api/submit', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            score: score,
            total_questions: questionsAnswered,
            time_taken: (questionsAnswered * 30) - timeLeft,
            lifelines_used: lifelinesUsed,
            answers: answeredQuestions,
            sets_completed: completedSets.length,
            completedSets: completedSets,  // NEW: Send array of completed set numbers
            partial_completion: questionsAnswered < quizQuestions.length
        })
    })
    .then(response => response.json())
    .then(data => {
        console.log('Quiz results saved:', data);
        // Clear saved progress after successful submission
        clearSavedProgress();
    })
    .catch(error => {
        console.error('Error saving quiz results:', error);
    });
}

// Retake Quiz
function retakeQuiz() {
    // Clear saved progress first
    clearSavedProgress();
    
    // Start a fresh quiz
    startNewQuiz();
}
</script>

<!-- Quiz Sound Management System -->
<script>
  // Centralized sound management for Quiz Challenge
  window.quizSounds = {
    play: function(soundId, volume = 0.3) {
      const audio = document.getElementById(soundId);
      if (audio) {
        audio.currentTime = 0;
        audio.volume = volume;
        audio.play().catch(e => console.log('Audio play failed:', e));
      }
    },
    
    playClick: function() {
      this.play('clickSound', 0.3);
    },
    
    playSelect: function() {
      this.play('selectSound', 0.25);
    },
    
    playCorrect: function() {
      this.play('correctSound', 0.4);
    },
    
    playIncorrect: function() {
      this.play('incorrectSound', 0.4);
    },
    
    playNav: function() {
      this.play('navSound', 0.25);
    },
    
    playClose: function() {
      this.play('closeSound', 0.3);
    },
    
    startBg: function() {
      const bgAudio = document.getElementById('bgSound');
      if (bgAudio) {
        bgAudio.volume = 0.1;
        bgAudio.loop = true;
        bgAudio.play().catch(e => console.log('Background audio failed:', e));
      }
    },
    
    stopBg: function() {
      const bgAudio = document.getElementById('bgSound');
      if (bgAudio) {
        bgAudio.pause();
        bgAudio.currentTime = 0;
      }
    }
  };

  // Auto-attach sound effects to quiz elements
  document.addEventListener('DOMContentLoaded', function() {
    // Add click sounds to all buttons
    document.querySelectorAll('button:not([data-no-sound])').forEach(button => {
      button.addEventListener('click', function() {
        window.quizSounds.playClick();
      });
    });

    // Add hover sounds to quiz options
    document.querySelectorAll('.option-btn').forEach(option => {
      option.addEventListener('mouseenter', function() {
        if (!this.disabled && !answered) {
          window.quizSounds.playSelect();
        }
      });
    });

    // Add sounds to lifeline buttons
    document.querySelectorAll('.lifeline-btn').forEach(btn => {
      btn.addEventListener('mouseenter', function() {
        if (!this.disabled) {
          window.quizSounds.playSelect();
        }
      });
    });
  });

  // Integrate sounds into existing quiz functions
  // Override selectAnswer to add sound feedback
  const originalSelectAnswer = window.selectAnswer;
  if (typeof originalSelectAnswer === 'function') {
    window.selectAnswer = function(selectedIndex) {
      // Play sound before executing original function
      const correctIndex = quizQuestions[currentQuestion].correct;
      if (selectedIndex === correctIndex) {
        window.quizSounds.playCorrect();
      } else {
        window.quizSounds.playIncorrect();
      }
      return originalSelectAnswer(selectedIndex);
    };
  }
</script>
