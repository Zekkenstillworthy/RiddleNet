<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In or Sign Up | RiddleNet</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="icon" href="{{ url_for('static', filename='img/Logo.png') }}">
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");
        @import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap");
        
        :root {
            /* Modern Gaming Network Theme */
            --primary-color: #0F172A;
            --secondary-color: #1E293B;
            --accent-color: #3B82F6;
            --success-color: #10B981;
            --warning-color: #F59E0B;
            --danger-color: #EF4444;
            --cyber-glow: #00D9FF;
            --neon-green: #39FF14;
            --network-purple: #8B5CF6;
            
            /* Background & Surface Colors */
            --background: #020617;
            --surface: #0F172A;
            --surface-hover: #1E293B;
            --border-color: rgba(59, 130, 246, 0.2);
            --glass-bg: rgba(15, 23, 42, 0.8);
            --glass-border: rgba(0, 217, 255, 0.15);
            
            /* Text Colors */
            --text-primary: #F8FAFC;
            --text-secondary: #CBD5E1;
            --text-muted: #64748B;
            
            /* Effects */
            --gradient-primary: linear-gradient(135deg, var(--cyber-glow), var(--network-purple));
            --gradient-secondary: linear-gradient(135deg, var(--neon-green), var(--cyber-glow));
            --shadow-lg: 0 25px 50px -12px rgba(26, 35, 126, 0.8);
            --shadow-glow: 0 0 20px rgba(59, 130, 246, 0.3);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--background);
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Network Grid Background Animation */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: 
                linear-gradient(rgba(59, 130, 246, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: -1;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Main container styles */
        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
            width: 900px;
            max-width: 95%;
            min-height: 550px;
            transition: all 0.3s ease;
        }

        /* Cyber-themed glow effect on container */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gradient-primary);
            opacity: 0.8;
        }

        .container::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--gradient-primary);
            opacity: 0.6;
            animation: dataFlow 3s ease-in-out infinite;
        }

        @keyframes dataFlow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .container:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-glow);
            border-color: var(--cyber-glow);
        }

        .form-container {
            position: absolute;
            top: 0;
            height: 100%;
            transition: all 0.6s ease-in-out;
            background: transparent;
        }

        .sign-in {
            left: 0;
            width: 50%;
            z-index: 2;
        }

        .container.active .sign-in {
            transform: translateX(100%);
        }

        .sign-up {
            left: 0;
            width: 50%;
            opacity: 0;
            z-index: 1;
        }

        .container.active .sign-up {
            transform: translateX(100%);
            opacity: 1;
            z-index: 5;
            animation: show 0.6s;
        }

        @keyframes show {
            0%, 49.99% {
                opacity: 0;
                z-index: 1;
            }
            50%, 100% {
                opacity: 1;
                z-index: 5;
            }
        }

        .toggle-container {
            position: absolute;
            top: 0;
            left: 50%;
            width: 50%;
            height: 100%;
            overflow: hidden;
            transition: all 0.6s ease-in-out;
            border-radius: 0 20px 20px 0;
            z-index: 1000;
        }

        .container.active .toggle-container {
            transform: translateX(-100%);
        }

        .toggle {
            background: var(--gradient-primary);
            height: 100%;
            background-size: 200% 200%;
            animation: gradientShift 4s ease infinite;
            color: #ffffff;
            position: relative;
            left: -100%;
            width: 200%;
            transition: all 0.6s ease-in-out;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container.active .toggle {
            transform: translateX(50%);
        }

        .toggle-panel {
            position: absolute;
            width: 50%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 30px;
            text-align: center;
            top: 0;
            transition: all 0.6s ease-in-out;
        }

        .toggle-left {
            transform: translateX(-200%);
        }

        .container.active .toggle-left {
            transform: translateX(0);
        }

        .toggle-right {
            right: 0;
            transform: translateX(0);
        }

        .container.active .toggle-right {
            transform: translateX(200%);
        }

        /* Form styling */
        form {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 40px;
            height: 100%;
            text-align: center;
            color: var(--text-primary);
            border-radius: 20px 0 0 20px;
            border: 1px solid var(--glass-border);
        }

        .sign-up form {
            border-radius: 0 20px 20px 0;
        }

        /* Logo styling */
        form img {
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px rgba(0, 217, 255, 0.3));
            transition: all 0.3s ease;
        }

        form img:hover {
            transform: scale(1.05);
            filter: drop-shadow(0 0 30px rgba(0, 217, 255, 0.5));
        }

        /* Input styling similar to admin */
        .input-box {
            position: relative;
            width: 100%;
            height: 56px;
            margin: 16px 0;
        }

        input {
            width: 100%;
            height: 56px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 16px;
            color: var(--text-primary);
            padding: 0 20px;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            margin: 8px 0;
        }

        input:focus {
            border-color: var(--cyber-glow);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.2);
            background: rgba(15, 23, 42, 0.8);
        }

        input::placeholder {
            color: var(--text-muted);
        }

        /* Button styling */
        button {
            width: 100%;
            height: 50px;
            background: var(--gradient-primary);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Orbitron', monospace;
            margin-top: 16px;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 217, 255, 0.3);
            background: var(--gradient-secondary);
        }

        button:active {
            transform: translateY(0);
        }

        button.hidden {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            font-size: 14px;
            height: 40px;
            margin-top: 20px;
        }

        button.hidden:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--cyber-glow);
            color: var(--cyber-glow);
            text-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
        }

        /* Special styling for OTP section */
        .otp-section {
            display: flex;
            width: 100%;
            gap: 10px;
            margin: 16px 0;
        }

        .otp-section input {
            flex: 1;
            margin: 0;
        }

        .otp-section button {
            flex: none;
            width: auto;
            padding: 0 16px;
            font-size: 12px;
            height: 56px;
            margin: 0;
        }

        #otp-timer {
            margin-top: 8px;
            font-size: 12px;
            color: var(--cyber-glow);
            text-align: center;
        }

        h1 {
            font-family: 'Orbitron', monospace;
            font-size: 28px;
            margin-bottom: 20px;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 600;
            text-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
        }

        .toggle-panel h1 {
            color: #ffffff;
            background: none;
            -webkit-text-fill-color: #ffffff;
            font-size: 32px;
        }

        p {
            font-size: 14px;
            line-height: 20px;
            letter-spacing: 0.3px;
            margin: 20px 0;
            color: var(--text-secondary);
        }

        /* Message styling - Updated for dark theme */
        .message-container {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            box-shadow: var(--shadow-lg);
            font-family: 'Inter', sans-serif;
            border-left: 5px solid var(--cyber-glow);
            backdrop-filter: blur(10px);
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10001;
            overflow: hidden;
            transition: all 0.3s ease;
            animation: slideInRight 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            opacity: 0;
            max-width: 380px;
            min-width: 280px;
            text-align: left;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            display: none;
        }

        .message-container.show {
            opacity: 1;
            display: block;
        }

        .message-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--cyber-glow), transparent);
            animation: shimmer 2s infinite;
        }

        .message-container.success-message {
            border-left-color: var(--success-color);
            background: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
        }

        .message-container.success-message::before {
            background: linear-gradient(90deg, transparent, var(--success-color), transparent);
        }

        .message-container.error-message {
            border-left-color: var(--danger-color);
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger-color);
        }

        .message-container.error-message::before {
            background: linear-gradient(90deg, transparent, var(--danger-color), transparent);
        }

        .message-container.warning-message {
            border-left-color: var(--warning-color);
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning-color);
        }

        .message-container.warning-message::before {
            background: linear-gradient(90deg, transparent, var(--warning-color), transparent);
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes shimmer {
            0%, 100% {
                opacity: 0.3;
            }
            50% {
                opacity: 0.8;
            }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .container {
                width: 95%;
                min-width: 320px;
                border-radius: 16px;
            }
            
            form {
                padding: 20px;
            }
            
            .toggle-panel {
                padding: 0 15px;
            }
            
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

<div class="container" id="container">
    <div class="form-container sign-up">
        <form action="{{ url_for('user.signup') }}" method="POST" id="signupForm">
            <img id="signup-logo" style="height: 150px; width: 150px;"  
            src="{{ url_for('static', filename='img/Logo.png') }}" alt="Logo">
            {% if qr_code_path %}
            <div>
                <img src="{{ url_for('static', filename=qr_code_path) }}" alt="QR Code">
            </div>
            {% endif %}
            <h1>Create Account</h1>
            <input type="text" name="username" placeholder="Username" required autocomplete="off">
            <input type="email" name="email" placeholder="Email" required autocomplete="off">
            <input type="password" name="password" placeholder="Password" required>
            <div id="signup-message" class="message-container"></div>
            <button type="submit">Sign Up</button>
        </form>
    </div>
    
    <div class="form-container sign-in">
        <form action="{{ url_for('user.login') }}" method="POST">
            <img style="height: 120px; width: 120px;"         
            src="{{ url_for('static', filename='img/Logo.png') }}" alt="Logo">
            <h1>Sign In</h1>
            {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
            {% endif %}
            <input type="text" name="username" id="login-username" placeholder="Username" required autocomplete="off">
            <input type="password" name="password" placeholder="Password" required>
            <div id="message" class="message-container"></div>
            <div class="otp-section">
                <input type="text" name="otp" id="otp" placeholder="OTP Code">
                <button type="button" id="requestOtp">Request OTP</button>
            </div>
            <div id="otp-timer" style="display: none;">
                OTP expires in: <span id="countdown">10:00</span>
            </div>
            <button type="submit">Sign In</button>
        </form>
    </div>
    
    <div class="toggle-container">
        <div class="toggle">
            <div class="toggle-panel toggle-left">
                <h1>Welcome Back</h1>
                <p>Enter your credentials to access your RiddleNet account</p>
                <button class="hidden" id="login">Sign In</button>
            </div>
            <div class="toggle-panel toggle-right">
                <h1>Join RiddleNet</h1>
                <p>Create your account and start your cybersecurity journey</p>
                <button class="hidden" id="register">Sign Up</button>
            </div>
        </div>
    </div>
</div>

{% if message %}
<script>
    // Display backend messages using notification styling
    document.addEventListener('DOMContentLoaded', function() {
        const messageElement = document.getElementById('message');
        messageElement.className = 'message-container error-message show';
        messageElement.textContent = "{{ message }}";
        
        // Auto-hide after 5 seconds
        setTimeout(() => {
            messageElement.className = 'message-container';
            messageElement.style.display = 'none';
        }, 5000);
    });
</script>
{% endif %}
<script src="{{ url_for('static', filename='js/otp.js') }}"></script>
<script>
    function playClickSound() {
        const audio = document.getElementById('clickSound');
        if (audio) {
            audio.currentTime = 0;
            audio.play();
        }
    }

    // Add click sound to all buttons
    document.querySelectorAll('button').forEach(button => {
        button.addEventListener('click', playClickSound);
    });

    const container = document.getElementById('container');
    const registerBtn = document.getElementById('register');
    const loginBtn = document.getElementById('login');

    registerBtn.addEventListener('click', () => {
        playClickSound();
        container.classList.add("active");
    });

    loginBtn.addEventListener('click', () => {
        playClickSound();
        container.classList.remove("active");
    });

    document.querySelector('.sign-up form').addEventListener('submit', function(event) {
        event.preventDefault(); // Prevent the form from submitting the traditional way
        const formData = new FormData(this);
        
        // Show loading state
        const messageElement = document.getElementById('signup-message');
        messageElement.className = 'message-container show';
        messageElement.innerHTML = '<span style="display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-radius:50%;border-top-color:transparent;animation:spin 1s linear infinite;margin-right:8px;"></span>Creating your account...';
        
        // Add animation style
        if (!document.getElementById('spin-animation')) {
            const style = document.createElement('style');
            style.id = 'spin-animation';
            style.textContent = '@keyframes spin {0% {transform: rotate(0deg);} 100% {transform: rotate(360deg);}}';
            document.head.appendChild(style);
        }

        // Disable submit button to prevent multiple submissions
        const submitButton = this.querySelector('button[type="submit"]');
        submitButton.disabled = true;
        submitButton.style.opacity = '0.7';

        fetch("{{ url_for('user.signup') }}", {
            method: 'POST',
            body: formData,
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'error') {
                // Show error message with notification styling
                messageElement.className = 'message-container error-message show';
                messageElement.textContent = data.message;
                
                // Clear and focus on the appropriate field based on the error message
                if (data.message.includes('Username already exists')) {
                    document.querySelector('input[name="username"]').value = '';
                    document.querySelector('input[name="username"]').focus();
                } else if (data.message.includes('Email address already in use')) {
                    document.querySelector('input[name="email"]').value = '';
                    document.querySelector('input[name="email"]').focus();
                }
                
                // Re-enable submit button
                submitButton.disabled = false;
                submitButton.style.opacity = '1';
                
                // Auto-hide error message after 5 seconds
                setTimeout(() => {
                    messageElement.className = 'message-container';
                    messageElement.style.display = 'none';
                }, 5000);
                
                return Promise.reject('Registration error'); // Stop the chain
            }
            
            // If signup successful, show success message with notification styling
            messageElement.className = 'message-container success-message show';
            messageElement.textContent = data.message;
            
            // Reset the form except for message
            const inputs = this.querySelectorAll('input');
            inputs.forEach(input => input.value = '');
            
            // Switch to login form after a short delay
            setTimeout(() => {
                container.classList.remove("active");
                // Hide the message with animation
                messageElement.className = 'message-container';
                messageElement.style.display = 'none';
                // Re-enable the button
                submitButton.disabled = false;
                submitButton.style.opacity = '1';
            }, 2000);
        })
        .catch(error => {
            if (error === 'Registration error') return; // Already handled
            
            // Show general error message with notification styling
            messageElement.className = 'message-container error-message show';
            messageElement.textContent = 'An error occurred. Please try again.';
            
            console.error('Error:', error);
            
            // Re-enable submit button
            submitButton.disabled = false;
            submitButton.style.opacity = '1';
            
            // Auto-hide error message after 5 seconds
            setTimeout(() => {
                messageElement.className = 'message-container';
                messageElement.style.display = 'none';
            }, 5000);
        });
    });
</script>
<audio id="clickSound" src="{{ url_for('static', filename='audio/Start.mp3') }}"></audio>
</body>
</html>
