        <script>

            const palette = document.getElementById("device-palette");
            const canvas = document.getElementById("Canvas");
            const ctx = canvas.getContext("2d");
            const deviceElements = document.querySelectorAll(".device");

            let selectedDevice = null;
            let devices = [];
            let connections = [];
            let isConnectionMode = false;
            let firstDevice = null;
            let isDragging = false;
            let draggedDevice = null;
            let selectedTopology = null;
            let startTime = null; // To track time spent on a topology
            let deviceRequirementsDisplayed = false;

            // Load topology types from the API when the page loads
            window.addEventListener('DOMContentLoaded', () => {
                loadTopologyTypes();
            });

            // Function to load topology types from the server data or API
            function loadTopologyTypes() {
                // First check if we have topology types from the server (through Jinja)
                if (AVAILABLE_TOPOLOGY_TYPES && AVAILABLE_TOPOLOGY_TYPES.length > 0) {
                    console.log('Using topology types from server:', AVAILABLE_TOPOLOGY_TYPES);
                    displayTopologyTypes(AVAILABLE_TOPOLOGY_TYPES);
                    return;
                }
                
                // Fall back to API if no server data is available
                fetch('/api/topology/types')
                    .then(response => response.json())
                    .then(data => {
                        if (data.status === 'success') {
                            displayTopologyTypes(data.topology_types);
                        } else {
                            console.error('Error loading topology types:', data.message);
                            // Display default topology types if API fails
                            displayTopologyTypes([
                                'point-to-point', 'mesh', 'star', 'bus', 'ring', 'tree', 'hybrid'
                            ]);
                        }
                    })
                    .catch(error => {
                        console.error('Error loading topology types:', error);
                        // Display default topology types if API fails
                        displayTopologyTypes([
                            'point-to-point', 'mesh', 'star', 'bus', 'ring', 'tree', 'hybrid'
                        ]);
                    });
            }

            // Function to display topology types in the UI
            function displayTopologyTypes(topologyTypes) {
                const container = document.getElementById('topology-buttons-container');
                
                // Clear the loading spinner
                container.innerHTML = '';
                
                // Add a button for each topology type
                topologyTypes.forEach(type => {
                    const button = document.createElement('button');
                    button.className = 'scenario-btn';
                    // Check if this topology is completed and add the class for checkmark
                    if (USER_COMPLETED_TOPOLOGIES.includes(type)) {
                        button.classList.add('completed');
                    }
                    button.onclick = function() { selectTopology(type); };
                    button.textContent = type.charAt(0).toUpperCase() + type.slice(1).replace(/-/g, ' ');
                    container.appendChild(button);
                });
            }

            // Preload images
            const images = {
                pc: new Image(),
                router: new Image(),
                switch: new Image(),
                server: new Image()
            };
            images.pc.src = "{{ url_for('static', filename='img/PC.png') }}";
            images.router.src = "{{ url_for('static', filename='img/Router.png') }}";
            images.switch.src = "{{ url_for('static', filename='img/Switch.png') }}";

            // Ensure images are fully loaded before using them
            const imagePromises = Object.values(images).map(img => {
                return new Promise(resolve => {
                    img.onload = resolve;
                });
            });

            Promise.all(imagePromises).then(() => {
                // All images are preloaded, now you can safely use them
                console.log("All images preloaded");
            });

            // Adjust canvas size
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
            function goToHome() {
                window.location.href = "{{ url_for('user.dashboard') }}";
            }

            class Device {
                constructor(type, x, y, label) {
                    this.type = type;
                    this.x = x;
                    this.y = y;
                    this.label = label;
                    this.image = images[type];
                    this.isImageLoaded = true;
                }

                draw(ctx) {
                    if (this.isImageLoaded) {
                        ctx.drawImage(this.image, this.x - 30, this.y - 25, 60, 60); // Increased size
                        // Draw device label below
                        ctx.fillStyle = "#00C3B5";
                        ctx.font = "14px Arial";
                        ctx.textAlign = "center";
                        ctx.fillText(this.label, this.x, this.y + 50); // Adjusted label position
                    }
                }
            }

            class PC extends Device {
                constructor(x, y, label) {
                    super('pc', x, y, label);
                }
            }

            class Router extends Device {
                constructor(x, y, label) {
                    super('router', x, y, label);
                }
            }

            class Switch extends Device {
                constructor(x, y, label) {
                    super('switch', x, y, label);
                }
            }





            deviceElements.forEach(el => {
                el.addEventListener("dragstart", handleDragStart);
            });

            const correctTopologies = {
                "point-to-point": (devices, connections) => {
                    return devices.length === 2 && connections.length === 1;
                },
                "mesh": (devices, connections) => {
                    // Create a map to store the connections for each device
                    const connectionMap = {};

                    // Initialize the connection map for each device
                    devices.forEach(device => {
                        connectionMap[device.label] = new Set();
                    });

                    // Populate the connection map
                    connections.forEach(connection => {
                        const device1 = connection.device1.label;
                        const device2 = connection.device2.label;

                        // Add the devices to each other's set
                        connectionMap[device1].add(device2);
                        connectionMap[device2].add(device1);
                    });

                    // Check if each device is connected to all other devices
                    for (let device of devices) {
                        if (connectionMap[device.label].size !== devices.length - 1) {
                            return false;  // Device is not connected to all other devices
                        }
                    }

                    return true;  // All devices are connected to each other
                }
                ,
                "star": (devices, connections) => {
                    if (devices.length < 3) return false; // Minimum 3 devices for a star
                    const centralDevice = connections.reduce((map, conn) => {
                        map[conn.device1.label] = (map[conn.device1.label] || 0) + 1;
                        map[conn.device2.label] = (map[conn.device2.label] || 0) + 1;
                        return map;
                    }, {});
                    const center = Object.values(centralDevice).filter(val => val === devices.length - 1).length === 1;
                    return center && connections.length === devices.length - 1;
                },
                "bus": (devices, connections) => {
                    return connections.length === devices.length - 1;
                },
                "ring": (devices, connections) => {
                    if (devices.length < 3) return false; // Minimum 3 devices for a ring
                    const deviceConnections = devices.reduce((map, device) => {
                        map[device.label] = 0;
                        return map;
                    }, {});
                    connections.forEach(conn => {
                        deviceConnections[conn.device1.label]++;
                        deviceConnections[conn.device2.label]++;
                    });
                    return Object.values(deviceConnections).every(count => count === 2) && connections.length === devices.length;
                },
                "tree": (devices, connections) => {
                    const deviceConnections = devices.reduce((map, device) => {
                        map[device.label] = 0;
                        return map;
                    }, {});
                    connections.forEach(conn => {
                        deviceConnections[conn.device1.label]++;
                        deviceConnections[conn.device2.label]++;
                    });
                    const root = Object.values(deviceConnections).filter(val => val > 1).length >= 1;
                    return root && connections.length === devices.length - 1;
                },
                "hybrid": (devices, connections) => {
                    return connections.length >= devices.length - 1;
                }
            };

            // Redraw canvas with devices and connections
            function redrawCanvas() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                connections.forEach(connection => drawConnection(connection));
                devices.forEach(device => drawDevice(device));
            }

            // Draw connection line between devices
            function drawConnection(connection) {
                ctx.beginPath();
                ctx.moveTo(connection.device1.x, connection.device1.y);
                ctx.lineTo(connection.device2.x, connection.device2.y);
                ctx.strokeStyle = "#00C3B5";
                ctx.lineWidth = 4;
                ctx.stroke();
            }

            // Draw device on the canvas
            function drawDevice(device) {
                device.draw(ctx);
                if (device === selectedDevice) {
                    ctx.beginPath();
                    ctx.arc(device.x, device.y, 30, 0, 2 * Math.PI); // Adjusted radius to fit the image
                    ctx.strokeStyle = "#FFD700";
                    ctx.lineWidth = 9; // Adjusted line width
                    ctx.stroke();
                    ctx.shadowColor = "transparent"; // Ensure no glow effect
                    ctx.shadowBlur = 0;
                }
            }





            // Add connection between devices
            function addConnection(device1, device2) {
                const existingConnection = connections.find(conn =>
                    (conn.device1 === device1 && conn.device2 === device2) ||
                    (conn.device1 === device2 && conn.device2 === device1)
                );

                if (!existingConnection) {
                    connections.push({ device1, device2 });
                    redrawCanvas();
                }
                firstDevice = null;  // Reset after connection
            }

            // Find connection by position for deletion
            function findConnectionByPosition(x, y) {
                return connections.find(connection => {
                    const { device1, device2 } = connection;
                    const distanceToLine = pointToLineDistance(x, y, device1.x, device1.y, device2.x, device2.y);
                    return distanceToLine < 10;  // Adjusted threshold for clicking accuracy (was 5)
                });
            }

            // Helper function to calculate distance from a point to a line
            function pointToLineDistance(px, py, x1, y1, x2, y2) {
                const A = px - x1;
                const B = py - y1;
                const C = x2 - x1;
                const D = y2 - y1;

                const dot = A * C + B * D;
                const lenSq = C * C + D * D;
                const param = lenSq !== 0 ? dot / lenSq : -1;

                let xx, yy;

                if (param < 0) {
                    xx = x1;
                    yy = y1;
                } else if (param > 1) {
                    xx = x2;
                    yy = y2;
                } else {
                    xx = x1 + param * C;
                    yy = y1 + param * D;
                }

                const dx = px - xx;
                const dy = py - yy;
                return Math.sqrt(dx * dx + dy * dy);
            }

                        } else if (rule.min) {
                            return `Need at least ${rule.min} connections`;
                        } else if (rule.max) {
                            return `Need at most ${rule.max} connections`;
                        }
                        break;
                    case 'device-type-connection':
                        if (rule.sourceType && rule.targetType) {

            // Calculate detailed score breakdown
            function getScoreBreakdown(config, timeTaken) {
                const scoreBreakdown = {
                    timeBonus: 0,
                    metrics: {}
                };
                
                // Calculate time efficiency bonus
                const timeMetric = config.scoring_metrics.time_efficiency || 10;
                if (timeTaken < 60) { // Less than 1 minute
                    scoreBreakdown.timeBonus = timeMetric;
                } else if (timeTaken < 120) { // Less than 2 minutes
                    scoreBreakdown.timeBonus = Math.floor(timeMetric * 0.8);
                } else if (timeTaken < 180) { // Less than 3 minutes
                    scoreBreakdown.timeBonus = Math.floor(timeMetric * 0.6);
                } else if (timeTaken < 300) { // Less than 5 minutes
                    scoreBreakdown.timeBonus = Math.floor(timeMetric * 0.4);
                } else {
                    scoreBreakdown.timeBonus = Math.floor(timeMetric * 0.2);
                }
                
                // Add individual metrics - in a more complete implementation, these would be
                // calculated based on how well each aspect was done
                scoreBreakdown.metrics = {
                    config_process: config.scoring_metrics.config_process || 25,
                    design_layout: config.scoring_metrics.design_layout || 20,
                    completeness: config.scoring_metrics.completeness || 20,
                    correctness: config.scoring_metrics.correctness || 25
                };
                
                return scoreBreakdown;
            }

                notification.style.backgroundColor = type === 'success' ? '#00645C' : '#FF5252';
                notification.style.color = '#fff';

                closeBtn.style.fontSize = '18px';
                closeBtn.onclick = () => notificationContainer.removeChild(notification);
                notification.appendChild(closeBtn);
                
                // Add to container
                notificationContainer.appendChild(notification);
                
                // Auto remove after duration
                if (duration > 0) {
                    setTimeout(() => {
                        if (notification.parentNode === notificationContainer) {

                    }, duration);

            document.addEventListener('DOMContentLoaded', function() {
                if (window.socketClient) {

                    // Join topology-specific room when topology type is selected
                    function joinTopologyRoom(topologyType) {
                        if (topologyType) {
                            window.socketClient.emit('join_topology', {
                                topology_type: topologyType,
                                page: 'topology'
                            });
                            console.log('Joined topology room:', topologyType);
                        }
                    }
                    
                    // Listen for topology completion events
                    window.socketClient.on('topology_completed', function(data) {
                        console.log('Topology completed via WebSocket:', data);
                        window.socketClient.showNotification(
                            'Topology Completed!', 
                            `Great job! You completed the ${data.topology_type} topology with a score of ${data.score || 'N/A'}!`
                        );
                    });
                    
                    // Listen for real-time topology network updates
                    window.socketClient.on('topology_network_update', function(data) {
                        console.log('Topology network update received:', data);
                        // Update the UI based on network changes
                        if (data.devices || data.connections) {
                            // Refresh the topology display if needed
                            window.socketClient.showNotification(
                                'Network Updated', 
                                'The topology network has been updated in real-time.'
                            );
                        }
                    });
                    
                    // Listen for topology progress updates
                    window.socketClient.on('topology_progress_updated', function(data) {
                        console.log('Topology progress updated:', data);
                        // Update progress indicators
                        if (data.progress_percentage !== undefined) {
                            const progressElement = document.querySelector('#progress-indicator');
                            if (progressElement) {
                                progressElement.textContent = `Progress: ${data.progress_percentage}%`;
                            }
                        }
                    });
                    
                    // Listen for admin messages specific to topology
                    window.socketClient.on('admin_topology_message', function(data) {
                        console.log('Admin topology message:', data);
                        window.socketClient.showNotification(
                            `Message from ${data.admin_name}`, 
                            data.message
                        );
                    });
                    
                    // Override topology selection to join appropriate rooms
                    const originalSelectTopology = window.selectTopology;
                    if (originalSelectTopology) {
                        window.selectTopology = function(topology) {
                            const result = originalSelectTopology(topology);
                            joinTopologyRoom(topology);
                            return result;
                        };
                    }
                    
                    // Emit topology events when user interacts
                    window.emitTopologyUpdate = function(updateData) {
                        if (window.socketClient) {
                            window.socketClient.emit('topology_network_update', {
                                ...updateData,
                                timestamp: new Date().toISOString(),
                                user_id: '{{ current_user.id if current_user.is_authenticated else "anonymous" }}'
                            });
                        }
                    };
                    
                    console.log('Topology WebSocket handlers initialized');
                } else {
                    console.warn('SocketClient not available for topology WebSocket integration');
                }
            });
