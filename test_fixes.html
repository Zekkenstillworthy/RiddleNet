<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duplicate Code Test</title>
</head>
<body>
    <h1>Testing Duplicate Code Fixes</h1>
    
    <!-- Test 1: Unique IDs -->
    <div id="test1">
        <h2>Test 1: Device Location IDs</h2>
        <input type="text" id="device-location" placeholder="Network device location">
        <input type="text" id="user-device-location" placeholder="User device location">
    </div>
    
    <!-- Test 2: Canvas -->
    <div id="test2">
        <h2>Test 2: Canvas Elements</h2>
        <canvas id="simulation-canvas" width="400" height="300"></canvas>
        <canvas id="network-canvas" width="400" height="300"></canvas>
    </div>

    <script>
        // Test unique IDs
        console.log("Testing unique IDs:");
        const deviceLocation = document.getElementById('device-location');
        const userDeviceLocation = document.getElementById('user-device-location');
        
        console.log("device-location element:", deviceLocation);
        console.log("user-device-location element:", userDeviceLocation);
        
        if (deviceLocation && userDeviceLocation) {
            console.log("✅ Both elements found with unique IDs");
        } else {
            console.log("❌ Missing elements or duplicate IDs");
        }
        
        // Test canvas elements
        console.log("Testing canvas elements:");
        const simCanvas = document.getElementById('simulation-canvas');
        const netCanvas = document.getElementById('network-canvas');
        
        console.log("simulation-canvas:", simCanvas);
        console.log("network-canvas:", netCanvas);
        
        if (simCanvas && netCanvas) {
            console.log("✅ Both canvas elements found");
        } else {
            console.log("❌ Missing canvas elements");
        }
        
        // Test function availability
        console.log("Testing global function:");
        if (typeof initializeValidationSystem === 'function') {
            console.log("✅ initializeValidationSystem function exists");
        } else {
            console.log("❌ initializeValidationSystem function not found");
        }
    </script>
</body>
</html>
