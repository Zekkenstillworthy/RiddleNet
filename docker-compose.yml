# Docker Compose for local testing of RiddleNet with Gunicorn
# This simulates the production environment for testing on Windows

version: '3.8'

services:
  riddlenet:
    build: .
    ports:
      - "8000:8000"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=false
      - SECRET_KEY=test-secret-key-for-docker
      - DATABASE_URL=sqlite:///test.db
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    
  # Optional: Add PostgreSQL for more realistic testing
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=riddlenet_test
      - POSTGRES_USER=riddlenet
      - POSTGRES_PASSWORD=testpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Optional: Add Redis for session/cache testing
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data: