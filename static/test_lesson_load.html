<!DOCTYPE html>
<html>
<head>
    <title>Test Lesson Loading</title>
</head>
<body>
    <h1>Test Lesson Loading Debug</h1>
    <button id="testBtn">Test Load Lessons for Module 1</button>
    <div id="result"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Page loaded, setting up test...');
            
            document.getElementById('testBtn').addEventListener('click', function() {
                console.log('Testing lesson loading API...');
                document.getElementById('result').innerHTML = '<p>Making API request...</p>';
                
                // Test the exact same API call that the JavaScript in class_content_manager.html makes
                fetch('/admin/api/classes/7/modules/1/lessons', {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    credentials: 'same-origin'
                })
                .then(response => {
                    console.log('Response status:', response.status);
                    console.log('Response headers:', response.headers);
                    return response.text();
                })
                .then(data => {
                    console.log('Response data:', data);
                    document.getElementById('result').innerHTML = '<pre>' + data + '</pre>';
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('result').innerHTML = '<p style="color: red;">Error: ' + error + '</p>';
                });
            });
        });
        
        // Also test immediately when page loads
        window.onload = function() {
            console.log('Auto-triggering API test...');
            setTimeout(function() {
                document.getElementById('testBtn').click();
            }, 1000);
        };
    </script>
</body>
</html>
