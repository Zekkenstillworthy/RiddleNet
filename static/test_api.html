<!DOCTYPE html>
<html>
<head>
    <title>Test Lessons API</title>
</head>
<body>
    <h1>Test Lessons API</h1>
    <button onclick="testAPI()">Test API Call</button>
    <div id="result"></div>

    <script>
    async function testAPI() {
        const resultDiv = document.getElementById('result');
        
        try {
            resultDiv.innerHTML = 'Testing API call...';
            
            const response = await fetch('/admin/api/classes/9/modules/1/lessons');
            
            resultDiv.innerHTML += `<br>Status: ${response.status} ${response.statusText}`;
            
            if (response.ok) {
                const data = await response.json();
                resultDiv.innerHTML += `<br>Success! Data: ${JSON.stringify(data, null, 2)}`;
            } else {
                const text = await response.text();
                resultDiv.innerHTML += `<br>Error response: ${text}`;
            }
            
        } catch (error) {
            resultDiv.innerHTML += `<br>Network error: ${error.message}`;
            console.error('API test error:', error);
        }
    }
    </script>
</body>
</html>
