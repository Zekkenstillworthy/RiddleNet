<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pcGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" fill="#0f172a" stroke="#00d9ff" stroke-width="2" rx="10"/>
  
  <!-- PC 1 -->
  <rect x="50" y="70" width="50" height="50" fill="url(#pcGradient)" stroke="#00d9ff" stroke-width="2" rx="6"/>
  <text x="75" y="90" text-anchor="middle" fill="white" font-family="Arial" font-size="9" font-weight="bold">PC 1</text>
  <text x="75" y="102" text-anchor="middle" fill="white" font-family="Arial" font-size="7">Computer</text>
  
  <!-- PC 2 -->
  <rect x="200" y="70" width="50" height="50" fill="url(#pcGradient)" stroke="#00d9ff" stroke-width="2" rx="6"/>
  <text x="225" y="90" text-anchor="middle" fill="white" font-family="Arial" font-size="9" font-weight="bold">PC 2</text>
  <text x="225" y="102" text-anchor="middle" fill="white" font-family="Arial" font-size="7">Computer</text>
  
  <!-- Connection Line -->
  <line x1="100" y1="95" x2="200" y2="95" stroke="#00d9ff" stroke-width="3"/>
  
  <!-- Connection dots -->
  <circle cx="100" cy="95" r="4" fill="#10B981"/>
  <circle cx="200" cy="95" r="4" fill="#10B981"/>
  
  <!-- Title -->
  <text x="150" y="25" text-anchor="middle" fill="#00d9ff" font-family="Arial" font-size="14" font-weight="bold">PC to PC Connection</text>
  
  <!-- Instruction -->
  <text x="150" y="160" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="10">Connect two PC devices with a cable</text>
</svg>