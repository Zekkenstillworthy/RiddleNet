<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pcGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="switchGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="routerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" fill="#0f172a" stroke="#00d9ff" stroke-width="2" rx="10"/>
  
  <!-- PC 1 -->
  <rect x="20" y="40" width="40" height="40" fill="url(#pcGradient)" stroke="#00d9ff" stroke-width="1" rx="4"/>
  <text x="40" y="58" text-anchor="middle" fill="white" font-family="Arial" font-size="7" font-weight="bold">PC1</text>
  
  <!-- PC 2 -->
  <rect x="20" y="120" width="40" height="40" fill="url(#pcGradient)" stroke="#00d9ff" stroke-width="1" rx="4"/>
  <text x="40" y="138" text-anchor="middle" fill="white" font-family="Arial" font-size="7" font-weight="bold">PC2</text>
  
  <!-- Switch -->
  <rect x="120" y="75" width="60" height="50" fill="url(#switchGradient)" stroke="#00d9ff" stroke-width="1" rx="4"/>
  <text x="150" y="95" text-anchor="middle" fill="white" font-family="Arial" font-size="8" font-weight="bold">SWITCH</text>
  <text x="150" y="107" text-anchor="middle" fill="white" font-family="Arial" font-size="6">Hub</text>
  
  <!-- Router -->
  <rect x="220" y="75" width="60" height="50" fill="url(#routerGradient)" stroke="#00d9ff" stroke-width="1" rx="4"/>
  <text x="250" y="95" text-anchor="middle" fill="white" font-family="Arial" font-size="8" font-weight="bold">ROUTER</text>
  <text x="250" y="107" text-anchor="middle" fill="white" font-family="Arial" font-size="6">Gateway</text>
  
  <!-- Router antennas -->
  <line x1="235" y1="75" x2="235" y2="68" stroke="#00d9ff" stroke-width="1"/>
  <line x1="250" y1="75" x2="250" y2="68" stroke="#00d9ff" stroke-width="1"/>
  <line x1="265" y1="75" x2="265" y2="68" stroke="#00d9ff" stroke-width="1"/>
  
  <!-- Connections -->
  <!-- PC1 to Switch -->
  <line x1="60" y1="60" x2="120" y2="90" stroke="#00d9ff" stroke-width="2"/>
  <circle cx="60" cy="60" r="3" fill="#10B981"/>
  <circle cx="120" cy="90" r="3" fill="#10B981"/>
  
  <!-- PC2 to Switch -->
  <line x1="60" y1="140" x2="120" y2="110" stroke="#00d9ff" stroke-width="2"/>
  <circle cx="60" cy="140" r="3" fill="#10B981"/>
  <circle cx="120" cy="110" r="3" fill="#10B981"/>
  
  <!-- Switch to Router -->
  <line x1="180" y1="100" x2="220" y2="100" stroke="#00d9ff" stroke-width="2"/>
  <circle cx="180" cy="100" r="3" fill="#10B981"/>
  <circle cx="220" cy="100" r="3" fill="#10B981"/>
  
  <!-- Title -->
  <text x="150" y="20" text-anchor="middle" fill="#00d9ff" font-family="Arial" font-size="12" font-weight="bold">Basic Network Setup</text>
  
  <!-- Instruction -->
  <text x="150" y="185" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">Build a complete network with PCs, Switch, and Router</text>
</svg>