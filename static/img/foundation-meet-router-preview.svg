<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="routerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" fill="#0f172a" stroke="#00d9ff" stroke-width="2" rx="10"/>
  
  <!-- Router Device -->
  <rect x="120" y="70" width="60" height="60" fill="url(#routerGradient)" stroke="#00d9ff" stroke-width="2" rx="8"/>
  <text x="150" y="95" text-anchor="middle" fill="white" font-family="Arial" font-size="10" font-weight="bold">ROUTER</text>
  <text x="150" y="107" text-anchor="middle" fill="white" font-family="Arial" font-size="8">Gateway</text>
  
  <!-- Router antennas -->
  <line x1="140" y1="70" x2="140" y2="60" stroke="#00d9ff" stroke-width="2"/>
  <line x1="160" y1="70" x2="160" y2="60" stroke="#00d9ff" stroke-width="2"/>
  
  <!-- Title -->
  <text x="150" y="25" text-anchor="middle" fill="#00d9ff" font-family="Arial" font-size="14" font-weight="bold">Meet Router Scenario</text>
  
  <!-- Instruction -->
  <text x="150" y="160" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="10">Drag a Router device to the canvas</text>
</svg>