<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pcGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" fill="#0f172a" stroke="#00d9ff" stroke-width="2" rx="10"/>
  
  <!-- PC Device -->
  <rect x="120" y="70" width="60" height="60" fill="url(#pcGradient)" stroke="#00d9ff" stroke-width="2" rx="8"/>
  <text x="150" y="95" text-anchor="middle" fill="white" font-family="Arial" font-size="10" font-weight="bold">PC</text>
  <text x="150" y="107" text-anchor="middle" fill="white" font-family="Arial" font-size="8">Computer</text>
  
  <!-- Title -->
  <text x="150" y="25" text-anchor="middle" fill="#00d9ff" font-family="Arial" font-size="14" font-weight="bold">Meet PC Scenario</text>
  
  <!-- Instruction -->
  <text x="150" y="160" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="10">Drag a PC device to the canvas</text>
</svg>