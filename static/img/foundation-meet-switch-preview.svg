<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="switchGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" fill="#0f172a" stroke="#00d9ff" stroke-width="2" rx="10"/>
  
  <!-- Switch Device -->
  <rect x="120" y="70" width="60" height="60" fill="url(#switchGradient)" stroke="#00d9ff" stroke-width="2" rx="8"/>
  <text x="150" y="95" text-anchor="middle" fill="white" font-family="Arial" font-size="10" font-weight="bold">SWITCH</text>
  <text x="150" y="107" text-anchor="middle" fill="white" font-family="Arial" font-size="8">Network</text>
  
  <!-- Ports on switch -->
  <circle cx="130" cy="115" r="2" fill="#00d9ff"/>
  <circle cx="140" cy="115" r="2" fill="#00d9ff"/>
  <circle cx="150" cy="115" r="2" fill="#00d9ff"/>
  <circle cx="160" cy="115" r="2" fill="#00d9ff"/>
  <circle cx="170" cy="115" r="2" fill="#00d9ff"/>
  
  <!-- Title -->
  <text x="150" y="25" text-anchor="middle" fill="#00d9ff" font-family="Arial" font-size="14" font-weight="bold">Meet Switch Scenario</text>
  
  <!-- Instruction -->
  <text x="150" y="160" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="10">Drag a Switch device to the canvas</text>
</svg>