<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="switchGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="routerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" fill="#0f172a" stroke="#00d9ff" stroke-width="2" rx="10"/>
  
  <!-- Switch -->
  <rect x="50" y="70" width="75" height="50" fill="url(#switchGradient)" stroke="#00d9ff" stroke-width="2" rx="6"/>
  <text x="87" y="90" text-anchor="middle" fill="white" font-family="Arial" font-size="9" font-weight="bold">SWITCH</text>
  <text x="87" y="102" text-anchor="middle" fill="white" font-family="Arial" font-size="7">Network Hub</text>
  
  <!-- Switch ports -->
  <circle cx="60" cy="110" r="2" fill="#00d9ff"/>
  <circle cx="70" cy="110" r="2" fill="#00d9ff"/>
  <circle cx="80" cy="110" r="2" fill="#00d9ff"/>
  <circle cx="90" cy="110" r="2" fill="#00d9ff"/>
  <circle cx="100" cy="110" r="2" fill="#00d9ff"/>
  <circle cx="110" cy="110" r="2" fill="#00d9ff"/>
  
  <!-- Router -->
  <rect x="175" y="70" width="75" height="50" fill="url(#routerGradient)" stroke="#00d9ff" stroke-width="2" rx="6"/>
  <text x="212" y="90" text-anchor="middle" fill="white" font-family="Arial" font-size="9" font-weight="bold">ROUTER</text>
  <text x="212" y="102" text-anchor="middle" fill="white" font-family="Arial" font-size="7">Gateway</text>
  
  <!-- Router antennas -->
  <line x1="190" y1="70" x2="190" y2="60" stroke="#00d9ff" stroke-width="2"/>
  <line x1="210" y1="70" x2="210" y2="60" stroke="#00d9ff" stroke-width="2"/>
  <line x1="230" y1="70" x2="230" y2="60" stroke="#00d9ff" stroke-width="2"/>
  
  <!-- Connection Line -->
  <line x1="125" y1="95" x2="175" y2="95" stroke="#00d9ff" stroke-width="3"/>
  
  <!-- Connection dots -->
  <circle cx="125" cy="95" r="4" fill="#10B981"/>
  <circle cx="175" cy="95" r="4" fill="#10B981"/>
  
  <!-- Title -->
  <text x="150" y="25" text-anchor="middle" fill="#00d9ff" font-family="Arial" font-size="14" font-weight="bold">Switch to Router Connection</text>
  
  <!-- Instruction -->
  <text x="150" y="160" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="10">Connect a Switch to a Router device</text>
</svg>