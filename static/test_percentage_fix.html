<!DOCTYPE html>
<html>
<head>
    <title>Activity Feed Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a1a; color: white; }
        .activity { padding: 10px; margin: 10px 0; background: #333; border-radius: 5px; }
        .score { color: #39FF14; font-weight: bold; }
        pre { background: #222; padding: 10px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔍 Activity Feed Test</h1>
    <button onclick="loadActivityFeed()">Load Activity Feed</button>
    <button onclick="loadRealTime()">Load Real-time Metrics</button>
    
    <div id="results"></div>
    
    <script>
        async function loadActivityFeed() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>Loading activity feed...</p>';
            
            try {
                const response = await fetch('/admin/api/analytics/activity-feed?limit=5');
                const data = await response.json();
                
                if (data.success) {
                    let html = '<h2>📊 Activity Feed Results</h2>';
                    
                    data.data.forEach(activity => {
                        html += `
                            <div class="activity">
                                <strong>${activity.username}</strong> - ${activity.action}<br>
                                Score: <span class="score">${activity.score}%</span><br>
                                <small>${activity.time_ago}</small>
                            </div>
                        `;
                    });
                    
                    html += '<h3>Raw JSON Response:</h3>';
                    html += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                    
                    resultsDiv.innerHTML = html;
                } else {
                    resultsDiv.innerHTML = `<p>❌ Error: ${data.error}</p>`;
                }
            } catch (error) {
                resultsDiv.innerHTML = `<p>❌ Network Error: ${error.message}</p>`;
            }
        }
        
        async function loadRealTime() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>Loading real-time metrics...</p>';
            
            try {
                const response = await fetch('/admin/api/analytics/real-time');
                const data = await response.json();
                
                if (data.success) {
                    let html = '<h2>⚡ Real-time Metrics</h2>';
                    html += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                    resultsDiv.innerHTML = html;
                } else {
                    resultsDiv.innerHTML = `<p>❌ Error: ${data.error}</p>`;
                }
            } catch (error) {
                resultsDiv.innerHTML = `<p>❌ Network Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
